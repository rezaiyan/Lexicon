<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexicon Architecture Explorer</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-card: #1a1d27;
    --bg-card-hover: #222636;
    --bg-node: #252a3a;
    --border: #2e3348;
    --border-active: #6c72cb;
    --text: #e1e4ed;
    --text-muted: #8b90a5;
    --text-dim: #5c6178;
    --accent: #6c72cb;
    --accent-light: #8b8fd9;
    --accent-glow: rgba(108,114,203,0.15);
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.12);
    --blue: #60a5fa;
    --blue-dim: rgba(96,165,250,0.12);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.12);
    --orange: #fb923c;
    --orange-dim: rgba(251,146,60,0.12);
    --pink: #f472b6;
    --pink-dim: rgba(244,114,182,0.12);
    --cyan: #22d3ee;
    --cyan-dim: rgba(34,211,238,0.12);
    --yellow: #fbbf24;
    --yellow-dim: rgba(251,191,36,0.12);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(15,17,23,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent-light), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-muted);
    flex: 1;
  }

  .breadcrumb-item {
    cursor: pointer;
    transition: color var(--transition);
    padding: 4px 8px;
    border-radius: 6px;
  }

  .breadcrumb-item:hover { color: var(--text); background: var(--bg-card); }
  .breadcrumb-item.active { color: var(--accent-light); }
  .breadcrumb-sep { color: var(--text-dim); font-size: 12px; }

  .stats-bar {
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .stat-item { display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* Main Canvas */
  .canvas {
    padding: 32px;
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
  }

  /* View Title */
  .view-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    opacity: 0;
    transform: translateY(-8px);
    animation: fadeIn 0.4s ease forwards;
  }

  .view-subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(-8px);
    animation: fadeIn 0.4s 0.05s ease forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Grid */
  .node-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }

  .node-grid.wide {
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }

  /* Node Card */
  .node-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px) scale(0.97);
  }

  .node-card.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .node-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--node-color, var(--accent));
    opacity: 0;
    transition: opacity var(--transition);
  }

  .node-card:hover {
    border-color: var(--node-color, var(--border-active));
    background: var(--bg-card-hover);
    transform: translateY(-2px) scale(1);
    box-shadow: var(--shadow), 0 0 0 1px var(--node-color, var(--border-active));
  }

  .node-card:hover::before { opacity: 1; }

  .node-card.leaf { cursor: default; }
  .node-card.leaf:hover { transform: translateY(0) scale(1); }

  .node-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .node-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: var(--node-bg, var(--accent-glow));
    flex-shrink: 0;
  }

  .node-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    background: var(--node-bg, var(--accent-glow));
    color: var(--node-color, var(--accent-light));
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .node-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
  }

  .node-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .node-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .meta-tag {
    padding: 3px 8px;
    background: var(--bg-node);
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .meta-tag .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--node-color, var(--text-dim));
  }

  .node-arrow {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg-node);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 12px;
    transition: all var(--transition);
  }

  .node-card:hover .node-arrow {
    background: var(--node-color, var(--accent));
    color: var(--bg);
  }

  /* Back Button */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 24px;
    transition: all var(--transition);
  }

  .back-btn:hover {
    background: var(--bg-card-hover);
    color: var(--text);
    border-color: var(--border-active);
  }

  /* Dependency Flow */
  .flow-section {
    margin-top: 32px;
    padding: 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    opacity: 0;
    animation: fadeIn 0.5s 0.3s ease forwards;
  }

  .flow-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  .flow-chain {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .flow-node {
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }

  .flow-node:hover { transform: scale(1.05); filter: brightness(1.2); }

  .flow-arrow {
    color: var(--text-dim);
    font-size: 18px;
    flex-shrink: 0;
  }

  /* Detail List */
  .detail-section {
    margin-top: 20px;
    opacity: 0;
    animation: fadeIn 0.4s 0.15s ease forwards;
  }

  .detail-group {
    margin-bottom: 20px;
  }

  .detail-group-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .detail-list {
    list-style: none;
  }

  .detail-list li {
    padding: 6px 10px;
    font-size: 13px;
    color: var(--text-muted);
    border-radius: 6px;
    transition: background var(--transition);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .detail-list li:hover { background: var(--bg-node); }

  .detail-list li .icon { font-size: 14px; flex-shrink: 0; width: 20px; text-align: center; }
  .detail-list li code {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 12px;
    color: var(--accent-light);
    background: var(--accent-glow);
    padding: 1px 6px;
    border-radius: 4px;
  }

  /* Sections */
  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  /* Patterns section */
  .pattern-card {
    background: var(--bg-node);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-bottom: 12px;
  }

  .pattern-card pre {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-muted);
    overflow-x: auto;
  }

  .pattern-card pre .kw { color: var(--purple); }
  .pattern-card pre .fn { color: var(--blue); }
  .pattern-card pre .tp { color: var(--green); }
  .pattern-card pre .cm { color: var(--text-dim); font-style: italic; }
  .pattern-card pre .st { color: var(--orange); }

  /* Responsive */
  @media (max-width: 768px) {
    .header { padding: 12px 16px; flex-wrap: wrap; }
    .canvas { padding: 16px; }
    .node-grid { grid-template-columns: 1fr; }
    .stats-bar { display: none; }
    .flow-chain { flex-direction: column; }
    .flow-arrow { transform: rotate(90deg); }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  /* Zoom transition */
  .canvas.zooming-in .node-grid { animation: zoomIn 0.35s ease; }
  .canvas.zooming-out .node-grid { animation: zoomOut 0.35s ease; }

  @keyframes zoomIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes zoomOut {
    from { opacity: 0; transform: scale(1.05); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    z-index: 200;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-muted);
    pointer-events: none;
    box-shadow: var(--shadow);
    max-width: 250px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .tooltip.show { opacity: 1; }

  /* Keyboard hint */
  .keyboard-hint {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--bg-card);
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    z-index: 50;
  }

  kbd {
    display: inline-block;
    padding: 2px 6px;
    font-size: 11px;
    background: var(--bg-node);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
    font-family: inherit;
    margin: 0 2px;
  }

  /* Two column layout for detail views */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  .full-width { grid-column: 1 / -1; }
</style>
</head>

// --- Navigation State ---
let navStack = ['root'];
let currentView = 'root';

function navigate(id, direction = 'in') {
  if (!ARCH[id]) return;
  if (direction === 'in') {
    navStack.push(id);
  }
  currentView = id;
  render(direction);
}

function goBack() {
  if (navStack.length <= 1) return;
  navStack.pop();
  currentView = navStack[navStack.length - 1];
  render('out');
}

function goTo(index) {
  if (index >= navStack.length - 1) return;
  navStack = navStack.slice(0, index + 1);
  currentView = navStack[navStack.length - 1];
  render('out');
}

// --- Render ---
function render(direction = 'in') {
  const node = ARCH[currentView];
  const canvas = document.getElementById('canvas');

  // Breadcrumb
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = navStack.map((id, i) => {
    const n = ARCH[id];
    const isLast = i === navStack.length - 1;
    let html = '';
    if (i > 0) html += '<span class="breadcrumb-sep">\u203A</span>';
    html += `<span class="breadcrumb-item ${isLast ? 'active' : ''}" onclick="goTo(${i})">${n.title}</span>`;
    return html;
  }).join('');

  // Build content
  let html = '';

  if (navStack.length > 1) {
    html += `<button class="back-btn" onclick="goBack()">
      \u2190 Back to ${ARCH[navStack[navStack.length - 2]].title}
    </button>`;
  }

  html += `<div class="view-title">${node.title}</div>`;
  html += `<div class="view-subtitle">${node.subtitle}</div>`;

  // Children grid
  if (node.children) {
    html += `<div class="node-grid${node.children.length > 6 ? '' : ' wide'}">`;
    node.children.forEach((childId, i) => {
      const child = ARCH[childId];
      if (!child) return;
      const isLeaf = child.leaf && !child.children;
      html += `
        <div class="node-card${isLeaf ? '' : ''}"
             style="--node-color:${child.color || 'var(--accent)'};--node-bg:${child.bg || 'var(--accent-glow)'};transition-delay:${i * 0.04}s"
             onclick="navigate('${childId}')"
             data-card>
          <div class="node-header">
            <div class="node-icon" style="background:${child.bg || 'var(--accent-glow)'}">${child.icon || ''}</div>
            <div class="node-badge" style="background:${child.bg};color:${child.color}">${child.badge || ''}</div>
          </div>
          <div class="node-name">${child.title}</div>
          <div class="node-desc">${child.desc || ''}</div>
          <div class="node-meta">
            ${(child.meta || []).map(m => `<span class="meta-tag"><span class="dot"></span>${m}</span>`).join('')}
          </div>
          <div class="node-arrow">\u2192</div>
        </div>`;
    });
    html += '</div>';
  }

  // Leaf detail view
  if (node.detail) {
    html += '<div class="detail-section">';

    if (node.detail.groups) {
      const groups = node.detail.groups;
      const useTwo = groups.length >= 2 && !node.detail.pattern;
      if (useTwo) html += '<div class="two-col">';
      groups.forEach(group => {
        html += `<div class="detail-group">
          <div class="detail-group-title">${group.title}</div>
          <ul class="detail-list">
            ${group.items.map(item => `
              <li>
                <span class="icon">${item.icon || ''}</span>
                <span>${item.code ? `<code>${item.code}</code> ` : ''}${item.text}${item.desc ? ` <span style="color:var(--text-dim)">- ${item.desc}</span>` : ''}</span>
              </li>
            `).join('')}
          </ul>
        </div>`;
      });
      if (useTwo) html += '</div>';
    }

    if (node.detail.pattern) {
      html += `<div class="section-divider"></div>
        <div class="pattern-card">
          <div class="detail-group-title" style="margin-bottom:12px">${node.detail.pattern.title}</div>
          <pre>${node.detail.pattern.code}</pre>
        </div>`;
    }

    html += '</div>';
  }

  // Data flow for root
  if (node.flow) {
    html += `<div class="flow-section">
      <div class="flow-title">Data Flow</div>
      <div class="flow-chain">
        ${node.flow.map((f, i) => {
          let s = `<div class="flow-node" style="background:${f.bg};color:${f.color}" onclick="navigate('${f.id}')">${f.label}</div>`;
          if (i < node.flow.length - 1) s += '<span class="flow-arrow">\u2192</span>';
          return s;
        }).join('')}
      </div>
    </div>`;
  }

  // Module boundaries for root
  if (currentView === 'root') {
    html += `<div class="flow-section" style="margin-top:16px">
      <div class="flow-title">Module Boundaries (Strict)</div>
      <div class="detail-list" style="list-style:none">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div style="padding:12px;background:var(--bg-node);border-radius:8px">
            <div style="color:var(--red);font-weight:600;font-size:13px;margin-bottom:6px">domain NEVER imports</div>
            <div style="font-size:12px;color:var(--text-muted)">data, presentation, platforms, core, composeApp</div>
          </div>
          <div style="padding:12px;background:var(--bg-node);border-radius:8px">
            <div style="color:var(--orange);font-weight:600;font-size:13px;margin-bottom:6px">presentation NEVER imports</div>
            <div style="font-size:12px;color:var(--text-muted)">data (only through domain)</div>
          </div>
          <div style="padding:12px;background:var(--bg-node);border-radius:8px">
            <div style="color:var(--pink);font-weight:600;font-size:13px;margin-bottom:6px">design-system NEVER imports</div>
            <div style="font-size:12px;color:var(--text-muted)">domain, data, presentation</div>
          </div>
          <div style="padding:12px;background:var(--bg-node);border-radius:8px">
            <div style="color:var(--green);font-weight:600;font-size:13px;margin-bottom:6px">domain must be</div>
            <div style="font-size:12px;color:var(--text-muted)">Pure Kotlin - no Room, Ktor, Koin, Compose, Android/iOS APIs</div>
          </div>
        </div>
      </div>
    </div>`;

    html += `<div class="flow-section" style="margin-top:16px">
      <div class="flow-title">Tech Stack</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
        ${[
          { label: 'Kotlin 2.2.21', c: 'var(--purple)' },
          { label: 'Compose MP 1.9.2', c: 'var(--green)' },
          { label: 'Ktor', c: 'var(--orange)' },
          { label: 'Room', c: 'var(--blue)' },
          { label: 'Koin', c: 'var(--cyan)' },
          { label: 'KMPAuth', c: 'var(--red)' },
          { label: 'Firebase', c: 'var(--yellow)' },
          { label: 'RevenueCat', c: 'var(--orange)' },
          { label: 'Sherpa ONNX', c: 'var(--pink)' },
          { label: 'Turbine', c: 'var(--accent-light)' },
        ].map(t => `<span style="padding:6px 12px;background:${t.c}15;color:${t.c};border-radius:20px;font-size:12px;font-weight:600">${t.label}</span>`).join('')}
      </div>
    </div>`;
  }

  canvas.className = `canvas zooming-${direction}`;
  canvas.innerHTML = html;

  // Stagger card animations
  requestAnimationFrame(() => {
    const cards = canvas.querySelectorAll('[data-card]');
    cards.forEach((card, i) => {
      setTimeout(() => card.classList.add('visible'), i * 50);
    });
  });
}

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') goBack();
});

// Initial render
render('in');
</script>
