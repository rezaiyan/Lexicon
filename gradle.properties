kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\=-Xmx8g -Djansi.tmpdir=/tmp
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Disable Gradle rich console to avoid jansi native library issues on ARM64 macOS
org.gradle.console=plain

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableR8.fullMode=true

#Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true

# KAN-17: Re-evaluated with Kotlin 2.3.0 — lifecycle viewmodel linker issue
# and compiler daemon compatibility are resolved. Re-enabling for faster iOS builds.
# kotlin.native.cacheKind=none              (was: iOS lifecycle viewmodel linker fix, no longer needed)

# Kotlin compiler daemon heap (used by K/N backend in 2.3.x - DevirtualizationAnalysis runs here)
# Note: -Dkotlin.daemon.jvm.options in org.gradle.jvmargs only applies in daemon mode;
# this property applies in both daemon and --no-daemon (CI) modes.
kotlin.daemon.jvm.options=-Xmx8g
kotlin.native.jvmArgs=-Xmx8g

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
