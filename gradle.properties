kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M" -Djansi.tmpdir=/tmp

# Disable Gradle rich console to avoid jansi native library issues on ARM64 macOS
org.gradle.console=plain

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true

# Room step4
kotlin.native.disableCompilerDaemon=true

# Fix for iOS lifecycle viewmodel linker symbol mismatch
kotlin.native.cacheKind=none

# Suppress Kotlin/Wasm stability warning
kotlin.wasm.stability.nowarn=true
