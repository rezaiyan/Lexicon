name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build and deploy'
        type: choice
        default: 'all'
        options:
          - all
          - android
          - ios
          - web
      version_bump:
        description: 'Bump version before build (commits and pushes tag)'
        type: choice
        default: 'none'
        options:
          - none
          - hotfix
          - minor
          - major

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VOKAB_BACKEND_URL: ${{ secrets.VOKAB_BACKEND_URL }}
  GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
  GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
  GOOGLE_IOS_URL_SCHEME: ${{ secrets.GOOGLE_IOS_URL_SCHEME }}
  FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
  FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_MOBILE_SDK_APP_ID: ${{ secrets.FIREBASE_MOBILE_SDK_APP_ID }}
  ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
  GOOGLE_ANDROID_CLIENT_ID_RELEASE: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID_RELEASE }}
  ANDROID_CERT_HASH_RELEASE: ${{ secrets.ANDROID_CERT_HASH_RELEASE }}
  GOOGLE_ANDROID_CLIENT_ID_DEBUG: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID_DEBUG }}
  ANDROID_CERT_HASH_DEBUG: ${{ secrets.ANDROID_CERT_HASH_DEBUG }}
  IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
  IOS_APP_STORE_ID: ${{ secrets.IOS_APP_STORE_ID }}
  REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
  REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
  FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      gradle: ${{ steps.filter.outputs.gradle }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ios:
              - '**/*.kt'
              - 'platforms/**'
              - 'iosApp/**'
              - 'gradle/libs.versions.toml'
            gradle:
              - 'gradle/libs.versions.toml'
              - '**/*.gradle.kts'
              - 'gradle/*.properties'

  check-version:
    name: Check unpublished version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_deploy_android: ${{ steps.check.outputs.should_deploy_android }}
      should_deploy_ios: ${{ steps.check.outputs.should_deploy_ios }}
      should_deploy_web: ${{ steps.check.outputs.should_deploy_web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for unpublished version tag
        id: check
        run: |
          # On PRs and manual triggers, always run all stages
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Non-push event — running all stages"
            echo "should_deploy_android=true" >> $GITHUB_OUTPUT
            echo "should_deploy_ios=true" >> $GITHUB_OUTPUT
            echo "should_deploy_web=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Find the latest mobile version tag
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No version tags found — skipping deploy stages"
            echo "should_deploy_android=false" >> $GITHUB_OUTPUT
            echo "should_deploy_ios=false" >> $GITHUB_OUTPUT
            echo "should_deploy_web=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Latest version tag: $LATEST_TAG"

          # Check per-platform deployment status
          if git tag -l "ci-deployed/android/$LATEST_TAG" | grep -q .; then
            echo "Android $LATEST_TAG already deployed — skipping"
            echo "should_deploy_android=false" >> $GITHUB_OUTPUT
          else
            echo "Android $LATEST_TAG not yet deployed"
            echo "should_deploy_android=true" >> $GITHUB_OUTPUT
          fi

          if git tag -l "ci-deployed/ios/$LATEST_TAG" | grep -q .; then
            echo "iOS $LATEST_TAG already deployed — skipping"
            echo "should_deploy_ios=false" >> $GITHUB_OUTPUT
          else
            echo "iOS $LATEST_TAG not yet deployed"
            echo "should_deploy_ios=true" >> $GITHUB_OUTPUT
          fi

          if git tag -l "ci-deployed/web/$LATEST_TAG" | grep -q .; then
            echo "Web $LATEST_TAG already deployed — skipping"
            echo "should_deploy_web=false" >> $GITHUB_OUTPUT
          else
            echo "Web $LATEST_TAG not yet deployed"
            echo "should_deploy_web=true" >> $GITHUB_OUTPUT
          fi

  # KAN-14: Dependency vulnerability review on PRs
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always

  # KAN-14: Submit dependency graph for GitHub security alerts
  dependency-submission:
    name: Dependency Submission
    needs: [changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.gradle == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4

  bump-version:
    name: Bump Version
    if: github.event.inputs.version_bump != 'none' && github.event.inputs.version_bump != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: ./scripts/bump-version.sh --${{ github.event.inputs.version_bump }}

      - name: Push version bump
        run: |
          git push origin main
          TAG=$(git describe --tags --abbrev=0)
          git push origin "$TAG"

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: git-lfs-${{ runner.os }}-${{ hashFiles('platforms/libs/**') }}
          restore-keys: git-lfs-${{ runner.os }}-

      - name: Pull LFS files
        run: git lfs pull

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # KAN-18: Run detekt with SARIF output for GitHub Code Scanning annotations
      - name: Run detekt
        run: ./gradlew detekt --stacktrace
        continue-on-error: true

      - name: Upload detekt SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

      - name: Run all tests
        run: ./gradlew composeApp:cleanAllTests composeApp:testDebugUnitTest composeApp:wasmJsBrowserTest --stacktrace

      - name: Generate code coverage report
        run: ./gradlew koverHtmlReport koverXmlReport --stacktrace

      - name: Verify code coverage thresholds
        run: ./gradlew koverVerify --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/reports/kover/
          retention-days: 14

      - name: Add coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: mi-kas/kover-report@v1
        with:
          path: build/reports/kover/report.xml
          title: Code Coverage
          update-comment: true
          min-coverage-overall: 40

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: composeApp/build/test-results/**/TEST-*.xml
          reporter: java-junit
          fail-on-empty: 'false'

  # KAN-27: iOS unit tests (commonTest on iosSimulatorArm64)
  test-ios:
    name: iOS Tests
    runs-on: macos-26
    needs: [changes]
    if: needs.changes.outputs.ios == 'true' || github.ref == 'refs/heads/main'
    timeout-minutes: 70
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: git-lfs-${{ runner.os }}-${{ hashFiles('platforms/libs/**') }}
          restore-keys: git-lfs-${{ runner.os }}-

      - name: Pull LFS files
        run: git lfs pull

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          architecture: 'aarch64'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Xcode
        run: xcodebuild -version

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Run iOS unit tests
        run: ./gradlew composeApp:iosSimulatorArm64Test --stacktrace

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            composeApp/build/reports/tests/iosSimulatorArm64Test/
            composeApp/build/test-results/iosSimulatorArm64Test/

      - name: iOS test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: iOS Test Results
          path: composeApp/build/test-results/iosSimulatorArm64Test/**/TEST-*.xml
          reporter: java-junit
          fail-on-empty: 'false'

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [test, check-version]
    if: |
      github.ref == 'refs/heads/main' && needs.check-version.outputs.should_deploy_android == 'true' &&
      (github.event.inputs.version_bump == null || github.event.inputs.version_bump == 'none') &&
      (github.event.inputs.platform == null || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: git-lfs-${{ runner.os }}-${{ hashFiles('platforms/libs/**') }}
          restore-keys: git-lfs-${{ runner.os }}-

      - name: Pull LFS files
        run: git lfs pull

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: ./gradlew composeApp:assembleDebug --stacktrace

      - name: Decode release keystore
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > composeApp/release.keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build release AAB
        run: ./gradlew composeApp:bundleRelease --stacktrace
        env:
          RELEASE_STORE_FILE: composeApp/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # KAN-17: Track APK size per build
      - name: Report APK size
        run: |
          APK=$(ls composeApp/build/outputs/apk/debug/*.apk | head -1)
          SIZE_BYTES=$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          echo "### APK Size: ${SIZE_MB} MB" >> $GITHUB_STEP_SUMMARY
          echo "apk_size_bytes=${SIZE_BYTES}" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab
          retention-days: 7

  maestro:
    name: Maestro UI Tests
    runs-on: ubuntu-latest
    needs: [test, build-android, check-version]
    if: |
      github.ref == 'refs/heads/main' && needs.check-version.outputs.should_deploy_android == 'true' &&
      (github.event.inputs.version_bump == null || github.event.inputs.version_bump == 'none') &&
      (github.event.inputs.platform == null || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: composeApp/build/outputs/apk/debug/

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Obtain CI auth tokens
        id: ci-auth
        env:
          CI_TEST_SECRET: ${{ secrets.CI_TEST_SECRET }}
          BACKEND_URL: ${{ secrets.VOKAB_BACKEND_URL }}
        run: |
          HTTP_CODE=$(curl -sL -o /tmp/ci-auth-response.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 \
            -X POST "${BACKEND_URL}/api/v1/auth/ci-token" \
            -H "X-CI-Secret: $CI_TEST_SECRET" \
            -H "Content-Type: application/json")

          RESPONSE=$(cat /tmp/ci-auth-response.json)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::CI auth endpoint returned HTTP $HTTP_CODE"
            echo "URL: ${BACKEND_URL}/api/v1/auth/ci-token"
            echo "Response: $RESPONSE"
            exit 1
          fi

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.data.accessToken')
          REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.data.refreshToken')
          EXPIRES_IN=$(echo "$RESPONSE" | jq -r '.data.expiresIn')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "::error::Failed to parse tokens from response"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$REFRESH_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "refresh_token=$REFRESH_TOKEN" >> $GITHUB_OUTPUT
          echo "expires_in=$EXPIRES_IN" >> $GITHUB_OUTPUT

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          script: |
            adb install composeApp/build/outputs/apk/debug/*.apk
            adb shell am start -n com.alirezaiyan.vokab/.MainActivity
            sleep 8
            adb shell "am broadcast -a com.alirezaiyan.vokab.CI_INJECT_TOKENS -n com.alirezaiyan.vokab/com.alirezaiyan.vokab.CiTokenReceiver --es accessToken '${{ steps.ci-auth.outputs.access_token }}' --es refreshToken '${{ steps.ci-auth.outputs.refresh_token }}' --el expiresInMs ${{ steps.ci-auth.outputs.expires_in }}"
            sleep 2
            adb shell am force-stop com.alirezaiyan.vokab
            sleep 2
            MAESTRO_EXIT=0
            maestro test --format junit --output "$HOME/maestro-report.xml" --debug-output "$HOME/maestro-debug" --flatten-debug-output maestro/ || MAESTRO_EXIT=$?
            adb uninstall com.alirezaiyan.vokab || true
            exit $MAESTRO_EXIT

      - name: Publish Maestro test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: ~/maestro-report.xml
          check_name: Maestro Test Results

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: |
            ~/maestro-report.xml
            ~/maestro-debug/
          retention-days: 7

  deploy-android:
    name: Deploy Android to Closed Testing
    runs-on: ubuntu-latest
    needs: [build-android, maestro, check-version]
    if: |
      github.ref == 'refs/heads/main' && needs.check-version.outputs.should_deploy_android == 'true' &&
      (github.event.inputs.version_bump == null || github.event.inputs.version_bump == 'none') &&
      (github.event.inputs.platform == null || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: composeApp/build/outputs/bundle/release/

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Upload to Google Play (closed testing)
        run: bundle exec fastlane android upload
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
          GOOGLE_PLAY_TRACK: early-access

  build-web:
    name: Build Web (wasmJs)
    runs-on: ubuntu-latest
    needs: [test, check-version]
    if: |
      github.ref == 'refs/heads/main' && needs.check-version.outputs.should_deploy_web == 'true' &&
      (github.event.inputs.version_bump == null || github.event.inputs.version_bump == 'none') &&
      (github.event.inputs.platform == null || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'web')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: git-lfs-${{ runner.os }}-${{ hashFiles('platforms/libs/**') }}
          restore-keys: git-lfs-${{ runner.os }}-

      - name: Pull LFS files
        run: git lfs pull

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wasmJs distribution
        run: ./gradlew composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 7

  deploy-web:
    name: Deploy Web to VPS
    runs-on: ubuntu-latest
    needs: [build-web, maestro, check-version]
    if: |
      always() &&
      github.ref == 'refs/heads/main' && needs.check-version.outputs.should_deploy_web == 'true' &&
      needs.build-web.result == 'success' &&
      (needs.maestro.result == 'success' || needs.maestro.result == 'skipped') &&
      (github.event.inputs.version_bump == null || github.event.inputs.version_bump == 'none') &&
      (github.event.inputs.platform == null || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'web')
    permissions:
      contents: read

    steps:
      - name: Download web distribution
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/

      - name: Setup SSH for deployment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEV_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -l -f ~/.ssh/deploy_key &> /dev/null; then
            echo "✗ Invalid SSH key format"
            exit 1
          fi

          ssh-keyscan -p "$VPS_SSH_PORT" -T 30 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>&1 || {
            echo "::error::ssh-keyscan failed for $VPS_HOST — aborting to prevent MITM"
            exit 1
          }

          echo "✓ SSH setup complete"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_WEB_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          DIST_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -p ${VPS_SSH_PORT}"

          echo "▸ Deploying to ${VPS_HOST}:${VPS_PATH} (port ${VPS_SSH_PORT})..."

          for attempt in 1 2 3; do
            if ssh $SSH_OPTS "dev@${VPS_HOST}" "echo 'SSH connection successful'"; then
              echo "✓ SSH connection established (attempt ${attempt})"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "✗ SSH connection failed after 3 attempts"
              exit 1
            fi
            echo "⚠ Attempt ${attempt} failed — retrying in 15s..."
            sleep 15
          done

          ssh $SSH_OPTS "dev@${VPS_HOST}" "mkdir -p ${VPS_PATH}"

          rsync -avz --delete --checksum \
            -e "ssh $SSH_OPTS" \
            "${DIST_DIR}/" \
            "dev@${VPS_HOST}:${VPS_PATH}/"

          echo "✓ Deployed to ${VPS_HOST}:${VPS_PATH}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment Summary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "### Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Host:** ${VPS_HOST}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-ios:
    name: Deploy iOS to TestFlight
    runs-on: macos-26
    needs: [test, test-ios, maestro, check-version]
    if: |
      always() &&
      github.ref == 'refs/heads/main' && needs.check-version.outputs.should_deploy_ios == 'true' &&
      needs.test.result == 'success' &&
      needs.test-ios.result == 'success' &&
      (needs.maestro.result == 'success' || needs.maestro.result == 'skipped') &&
      (github.event.inputs.version_bump == null || github.event.inputs.version_bump == 'none') &&
      (github.event.inputs.platform == null || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios')
    timeout-minutes: 70
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: git-lfs-${{ runner.os }}-${{ hashFiles('platforms/libs/**') }}
          restore-keys: git-lfs-${{ runner.os }}-

      - name: Pull LFS files
        run: git lfs pull

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'aarch64'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Xcode
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: iosApp

      - name: Set up certificates and provisioning profiles
        id: ios-certs
        uses: ./.github/actions/ios-cert-setup
        with:
          certificate_base64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          certificate_password: ${{ secrets.IOS_CERTIFICATES_PASSWORD }}
          provisioning_profile_base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Write GoogleService-Info.plist
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is not set"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build Kotlin Multiplatform Framework
        run: ./gradlew composeApp:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: iosApp/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache Xcode derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: xcode-deriveddata-${{ runner.os }}-

      - name: Upload to TestFlight
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ steps.ios-certs.outputs.profile_name }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 10
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 6
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          export APP_STORE_CONNECT_API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          cd iosApp
          bundle exec fastlane beta

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f iosApp/iosApp/GoogleService-Info.plist
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8

  mark-deployed-android:
    name: Mark Android as deployed
    runs-on: ubuntu-latest
    needs: [deploy-android, check-version]
    if: |
      always() &&
      needs.check-version.outputs.should_deploy_android == 'true' &&
      needs.deploy-android.result == 'success' &&
      (github.event.inputs.version_bump == null || github.event.inputs.version_bump == 'none') &&
      (github.event.inputs.platform == null || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag Android as deployed
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -n "$LATEST_TAG" ] && ! git tag -l "ci-deployed/android/$LATEST_TAG" | grep -q .; then
            git tag "ci-deployed/android/$LATEST_TAG"
            git push origin "ci-deployed/android/$LATEST_TAG"
            echo "Marked Android $LATEST_TAG as deployed"
          fi

  mark-deployed-ios:
