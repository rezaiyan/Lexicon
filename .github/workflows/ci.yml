      (github.event.inputs.version_bump == null || github.event.inputs.version_bump == 'none') &&
      (github.event.inputs.platform == null || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'web')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag Web as deployed
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -n "$LATEST_TAG" ] && ! git tag -l "ci-deployed/web/$LATEST_TAG" | grep -q .; then
            git tag "ci-deployed/web/$LATEST_TAG"
            git push origin "ci-deployed/web/$LATEST_TAG"
