    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag iOS as deployed
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -n "$LATEST_TAG" ] && ! git tag -l "ci-deployed/ios/$LATEST_TAG" | grep -q .; then
            git tag "ci-deployed/ios/$LATEST_TAG"
            git push origin "ci-deployed/ios/$LATEST_TAG"
            echo "Marked iOS $LATEST_TAG as deployed"
          fi

  mark-deployed-web:
