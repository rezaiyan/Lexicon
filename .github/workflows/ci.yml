name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VOKAB_BACKEND_URL: ${{ secrets.VOKAB_BACKEND_URL }}
  GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
  GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
  GOOGLE_IOS_URL_SCHEME: ${{ secrets.GOOGLE_IOS_URL_SCHEME }}
  FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
  FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_MOBILE_SDK_APP_ID: ${{ secrets.FIREBASE_MOBILE_SDK_APP_ID }}
  ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
  GOOGLE_ANDROID_CLIENT_ID_RELEASE: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID_RELEASE }}
  ANDROID_CERT_HASH_RELEASE: ${{ secrets.ANDROID_CERT_HASH_RELEASE }}
  GOOGLE_ANDROID_CLIENT_ID_DEBUG: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID_DEBUG }}
  ANDROID_CERT_HASH_DEBUG: ${{ secrets.ANDROID_CERT_HASH_DEBUG }}
  IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
  IOS_APP_STORE_ID: ${{ secrets.IOS_APP_STORE_ID }}
  REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
  REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
  FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all tests
        run: ./gradlew composeApp:cleanAllTests composeApp:allTests composeApp:wasmJsBrowserTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: composeApp/build/test-results/**/TEST-*.xml
          reporter: java-junit

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: ./gradlew composeApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  build-web:
    name: Build Web (wasmJs)
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wasmJs distribution
        run: ./gradlew composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 7

  deploy-web:
    name: Deploy Web to VPS
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download web distribution
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/

      - name: Setup SSH for deployment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>&1 || {
            echo "Warning: ssh-keyscan failed, trying alternative method..."
            ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts 2>&1 || true
          }

          if ! ssh-keygen -l -f ~/.ssh/deploy_key &> /dev/null; then
            echo "✗ Invalid SSH key format"
            exit 1
          fi

          echo "✓ SSH setup complete"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_WEB_PATH }}
        run: |
          DIST_DIR="composeApp/build/dist/wasmJs/productionExecutable"

          echo "▸ Deploying to ${VPS_HOST}:${VPS_PATH}..."

          if ! ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 "root@${VPS_HOST}" "echo 'SSH connection successful'"; then
            echo "✗ SSH connection failed"
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "root@${VPS_HOST}" "mkdir -p ${VPS_PATH}"

          rsync -avz --delete --checksum \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            "${DIST_DIR}/" \
            "root@${VPS_HOST}:${VPS_PATH}/"

          echo "✓ Deployed to ${VPS_HOST}:${VPS_PATH}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment Summary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "### Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Host:** ${VPS_HOST}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  build-ios:
    name: Build iOS
    runs-on: macos-15
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'aarch64'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Xcode
        run: xcodebuild -version

      - name: Build iOS Framework
        run: ./gradlew composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
