name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to release'
        type: choice
        default: 'all'
        options:
          - all
          - android
          - ios

concurrency:
  group: release
  cancel-in-progress: false

env:
  VOKAB_BACKEND_URL: ${{ secrets.VOKAB_BACKEND_URL }}
  GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
  GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
  GOOGLE_IOS_URL_SCHEME: ${{ secrets.GOOGLE_IOS_URL_SCHEME }}
  FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
  FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_MOBILE_SDK_APP_ID: ${{ secrets.FIREBASE_MOBILE_SDK_APP_ID }}
  ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
  GOOGLE_ANDROID_CLIENT_ID_RELEASE: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID_RELEASE }}
  ANDROID_CERT_HASH_RELEASE: ${{ secrets.ANDROID_CERT_HASH_RELEASE }}
  GOOGLE_ANDROID_CLIENT_ID_DEBUG: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID_DEBUG }}
  ANDROID_CERT_HASH_DEBUG: ${{ secrets.ANDROID_CERT_HASH_DEBUG }}
  IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
  IOS_APP_STORE_ID: ${{ secrets.IOS_APP_STORE_ID }}
  REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
  REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
  FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}

jobs:
  release-android:
    name: Build & Release Android
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: git-lfs-${{ runner.os }}-${{ hashFiles('platforms/libs/**') }}
          restore-keys: git-lfs-${{ runner.os }}-

      - name: Pull LFS files
        run: git lfs pull

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build and upload to Google Play (closed testing)
        run: bundle exec fastlane android beta
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: composeApp/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab
          retention-days: 30

  release-ios:
    name: Build & Release iOS
    runs-on: macos-26
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios')
    timeout-minutes: 70
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: git-lfs-${{ runner.os }}-${{ hashFiles('platforms/libs/**') }}
          restore-keys: git-lfs-${{ runner.os }}-

      - name: Pull LFS files
        run: git lfs pull

      - name: Initialize configuration
        uses: ./.github/actions/init-config

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'aarch64'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Xcode
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: iosApp

      - name: Set up certificates and provisioning profiles
        id: ios-certs
        uses: ./.github/actions/ios-cert-setup
        with:
          certificate_base64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          certificate_password: ${{ secrets.IOS_CERTIFICATES_PASSWORD }}
          provisioning_profile_base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Write GoogleService-Info.plist
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is not set"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build Kotlin Multiplatform Framework
        run: ./gradlew composeApp:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: iosApp/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache Xcode derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: xcode-deriveddata-${{ runner.os }}-

      - name: Build and upload to TestFlight
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ steps.ios-certs.outputs.profile_name }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 10
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 6
        run: |
          # Save App Store Connect API Key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          # Set the API key path for Fastlane
          export APP_STORE_CONNECT_API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          cd iosApp
          bundle exec fastlane beta

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f iosApp/iosApp/GoogleService-Info.plist
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: iosApp/build/*.ipa
          retention-days: 30

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-android, release-ios]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.release-android.result == 'success' || needs.release-ios.result == 'success')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Resolve version tag
        id: version
        run: |
          VERSION=$(grep '^versionName=' versioning.properties | cut -d= -f2)
          TAG="v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "Found tag: ${TAG}"
          else
            echo "::error::Tag ${TAG} does not exist — create a version tag before releasing"
            exit 1
          fi

      - name: Download Android AAB
        if: needs.release-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: ./android

      - name: Download iOS IPA
        if: needs.release-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ./ios

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            android/*.aab
            ios/*.ipa
