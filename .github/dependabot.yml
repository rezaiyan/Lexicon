version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      # Every 2 months: 1st of Jan, Mar, May, Jul, Sep, Nov at 09:00 UTC
      interval: cron
      cronjob: "0 9 1 */2 *"
    open-pull-requests-limit: 5
    # Compose 1.12+ requires AGP 9.1+ and compileSdk 37 — remove after that migration
    ignore:
      - dependency-name: "org.jetbrains.compose*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.androidx*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      compose:
        patterns: ["org.jetbrains.compose*", "org.jetbrains.androidx*"]
      firebase:
        patterns: ["com.google.firebase*", "dev.gitlive:firebase*"]
      ktor:
        patterns: ["io.ktor*"]
      koin:
        patterns: ["io.insert-koin*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *"
    open-pull-requests-limit: 3
