sqldelight-web-worker-driver = { module = "app.cash.sqldelight:web-worker-driver", version.ref = "sqldelight" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koinCompose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koinCompose" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

# KMPAuth
kmpauth-firebase = { module = "io.github.mirzemehdi:kmpauth-firebase", version.ref = "kmpauth" }
kmpauth-google = { module = "io.github.mirzemehdi:kmpauth-google", version.ref = "kmpauth" }
kmpauth-uihelper = { module = "io.github.mirzemehdi:kmpauth-uihelper", version.ref = "kmpauth" }

# GitLive Firebase (required by KMPAuth)
gitlive-firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "gitliveFirebase" }

# Emoji.kt
emoji-compose-m3 = { module = "org.kodein.emoji:emoji-compose-m3", version.ref = "emoji-kt" }

# Compottie (Lottie for Compose Multiplatform)
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
compottie-network = { module = "io.github.alexzhirkevich:compottie-network", version.ref = "compottie" }

# RevenueCat Purchases
purchases-kmp-core = { module = "com.revenuecat.purchases:purchases-kmp-core", version.ref = "revenuecat-kmp" }
purchases-kmp-ui = { module = "com.revenuecat.purchases:purchases-kmp-ui", version.ref = "revenuecat-kmp" }
purchases-kmp-either = { module = "com.revenuecat.purchases:purchases-kmp-either", version.ref = "revenuecat-kmp" }
purchases-kmp-result = { module = "com.revenuecat.purchases:purchases-kmp-result", version.ref = "revenuecat-kmp" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntime" }



[bundles]
composeAppCommonMainApi = [
    "navigation-compose",
    "lifecycle-viewmodel",
    "lifecycle-runtime-compose",
    "lifecycle-viewmodel-compose",
    "koin-core",
    "koin-compose",
    "koin-compose-viewmodel"
]
composeAppCommonMainImplementation = [
    "coil-compose",
    "coil-network-ktor"
]
composeAppMobileMainImplementation = [
    "kmpauth-google",
    "kmpauth-firebase",
    "kmpauth-uihelper",
    "gitlive-firebase-auth",
    "purchases-kmp-core"
]
composeAppAndroidMainImplementation = [
    "androidx-activity-compose",
    "androidx-exifinterface",
    "ktor-client-android",
    "koin-android",
    "koin-compose",
    "billing-ktx",
    "androidx-core-splashscreen",
    "androidx-security-crypto",
    "google-firebase-analytics",
    "google-firebase-crashlytics",
    "google-firebase-messaging",
    "firebase-auth"
]
composeAppCommonTestImplementation = [
    "kotlin-test",
    "kotlinx-coroutines-test",
    "turbine"
]
composeAppAndroidInstrumentedTestImplementation = [
    "androidx-test-junit",
    "androidx-espresso-core",
    "kotlin-test",
    "kotlin-test-junit",
    "kotlinx-coroutines-test",
    "core-ktx",
    "androidx-runner",
    "androidx-rules"
]
composeAppIosMainImplementation = [
    "ktor-client-darwin"
]
composeAppWasmJsMainImplementation = [
    "ktor-client-js"
]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
googleServices = { id = "com.google.gms.google-services", version = "4.4.4" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.6" }