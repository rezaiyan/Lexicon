build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 60
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated:
      - 'Composable'
  CyclomaticComplexMethod:
    threshold: 15
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 10

style:
  UnusedImports:
    active: true
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: false
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Preview'

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

empty-blocks:
  EmptyFunctionBlock:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/androidTest/**'

exceptions:
  TooGenericExceptionThrown:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/androidTest/**'
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'Exception'
      - 'RuntimeException'
      - 'Throwable'
  SwallowedException:
    active: true

performance:
  SpreadOperator:
    active: false
