# Maestro Workspace Configuration — CLI 2.2.0+
# Docs: https://docs.maestro.dev
#
# Recommended: use the wrapper script that handles install, auth, test, and cleanup:
#   ./maestro/run.sh                          # all flows
#   ./maestro/run.sh maestro/flows/study/     # single category
#   ./maestro/run.sh maestro/flows/word_manager/01_screen_loads.yaml  # single flow
#
# Manual run (if app is already installed and authenticated):
#   maestro test maestro/
#
# Prerequisites:
#   1. Install Maestro CLI:
#      curl -fsSL "https://get.maestro.mobile.dev" | bash
#   2. Build the debug APK:
#      ./gradlew composeApp:assembleDebug
#   3. Start an Android emulator or connect a device with USB debugging enabled.
#   4. Ensure the device is not locked / screen is on.
#
# ── Flow directories (NOT in CI) ────────────────────────────────────────────
#
#   flows/showcase/     — Video recording flows for demo/marketing. Not CI.
#                         Each flow has cinematic pauses and covers the full
#                         user journey for a feature.
#
#   flows/local_only/   — Developer-only flows (UX audits, screenshot dumps).
#                         Not CI. Run manually when reviewing UI changes:
#                           maestro test maestro/flows/local_only/
#
#   flows/utils/        — Reusable sub-flows (navigate_to_*, add_test_word).
#                         Not run directly; called via runFlow from other flows.
#
# ── Excluded CI flows ────────────────────────────────────────────────────────
#
#   word_manager/02_empty_state.yaml   — Requires a zero-word account.
#                                        The CI test account always has data
#                                        (server sync). Run manually on a
#                                        fresh account.

flows:
  - "flows/navigation/*.yaml"
  - "flows/import/01_manual_text_input.yaml"
  - "flows/import/02_file_import_ui.yaml"
  # 03_import_sheet_tabs tests in-sheet back navigation (method chooser ↔
  # language chooser); distinct regression value from 01 and 02.
  - "flows/import/03_import_sheet_tabs.yaml"
  # 04_tag_selector_in_import verifies the TagSelectorRow and inline create-tag
  # dialog appear in the manual text import flow.
  - "flows/import/04_tag_selector_in_import.yaml"
  - "flows/import/06_image_import_from_gallery.yaml"
  # 07_import_validation_errors verifies the Add Word button is disabled when
  # required fields are empty (both empty, and original-only with no translation).
  - "flows/import/07_import_validation_errors.yaml"
  - "flows/study/*.yaml"
  - "flows/profile/01_profile_screen_loads.yaml"
  - "flows/profile/02_more_options_sheet.yaml"
  - "flows/profile/03_logout_sheet.yaml"
  - "flows/profile/04_leaderboard_screen.yaml"
  # 05_edit_profile verifies the edit screen loads, accepts a username change,
  # and dismisses back to the Profile screen after saving.
  - "flows/profile/05_edit_profile.yaml"
  - "flows/settings/01_settings_screen_loads.yaml"
  - "flows/settings/02_theme_dialog.yaml"
  - "flows/settings/03_notification_settings.yaml"
  - "flows/settings/04_subscription_screen.yaml"
  - "flows/settings/05_tag_manager_screen.yaml"
  # 06_notification_toggle verifies the Enable Notifications switch changes the
  # subtitle text when tapped and can be toggled back.
  - "flows/settings/06_notification_toggle.yaml"
  # word_manager/02_empty_state excluded — see header comment in that file.
  - "flows/word_manager/01_screen_loads.yaml"
  - "flows/word_manager/03_search_functionality.yaml"
  - "flows/word_manager/04_select_deselect.yaml"
  - "flows/word_manager/05_edit_word_dialog.yaml"
  - "flows/word_manager/06_delete_flow.yaml"
  - "flows/word_manager/08_word_detail_sheet.yaml"
  - "flows/word_manager/09_tag_assignment.yaml"
  # 10_sort_order verifies the sort chip label updates when a different sort
  # option is selected from the dropdown.
  - "flows/word_manager/10_sort_order.yaml"

executionOrder:
  continueOnFailure: true
  flowsOrder:
    # Navigation smoke test first (validates all tabs are reachable)
    - flows/navigation/01_bottom_tab_navigation.yaml
    # Import tests (create test data for subsequent tests)
    - flows/import/01_manual_text_input.yaml
    - flows/import/02_file_import_ui.yaml
    - flows/import/03_import_sheet_tabs.yaml
    - flows/import/04_tag_selector_in_import.yaml
    - flows/import/06_image_import_from_gallery.yaml
    - flows/import/07_import_validation_errors.yaml
    # Study/review tests (need words to exist)
    - flows/study/01_study_screen_loads.yaml
    - flows/study/02_edit_word_from_review.yaml
    - flows/study/03_review_rating_buttons.yaml
    - flows/study/04_review_completion.yaml
    - flows/study/05_tag_filter_long_press.yaml
    - flows/study/06_nope_rating_path.yaml
    # Profile tests
    - flows/profile/01_profile_screen_loads.yaml
    - flows/profile/02_more_options_sheet.yaml
    - flows/profile/03_logout_sheet.yaml
    - flows/profile/04_leaderboard_screen.yaml
    - flows/profile/05_edit_profile.yaml
    # Settings tests
    - flows/settings/01_settings_screen_loads.yaml
    - flows/settings/02_theme_dialog.yaml
    - flows/settings/03_notification_settings.yaml
    - flows/settings/04_subscription_screen.yaml
    - flows/settings/05_tag_manager_screen.yaml
    - flows/settings/06_notification_toggle.yaml
    # Word manager tests run last (some tests delete words — run destructive last)
    - flows/word_manager/01_screen_loads.yaml
    - flows/word_manager/03_search_functionality.yaml
    - flows/word_manager/04_select_deselect.yaml
    - flows/word_manager/05_edit_word_dialog.yaml
    - flows/word_manager/06_delete_flow.yaml
    - flows/word_manager/08_word_detail_sheet.yaml
    - flows/word_manager/09_tag_assignment.yaml
    - flows/word_manager/10_sort_order.yaml
