appId: com.alirezaiyan.vokab
tags:
  - import
  - method-selector
---
# Test: Import method selector shows options for premium users.
#
# Verifies that tapping "Import Words" opens the method selector sheet
# with "AI Assistant" and "Manually" options. Tapping "Manually" opens
# the import bottom sheet.
#
# Note: This test assumes the account has premium access. If not premium,
# the import sheet opens directly (skipping the method selector), which
# is still a valid outcome since the assertions are optional.

- launchApp:
    clearState: false

- runFlow: ../utils/navigate_to_study.yaml

# Tap "Import Words" to open the import method selector.
- tapOn: "Import Words"

# For premium users: the method selector sheet must appear.
- assertVisible:
    text: "Add Words"
    optional: true
- assertVisible:
    text: "AI Assistant"
    optional: true
- assertVisible:
    text: "Manually"
    optional: true

# The description subtitle should be visible.
- assertVisible:
    text: "Choose how you'd like to build your vocabulary"
    optional: true

# Tap "Manually" to open the manual import sheet (or the sheet is already open for non-premium).
- tapOn:
    text: "Manually"
    optional: true

# The import sheet must be open with the Type Text tab.
- assertVisible: "Type Text"

# Close the import sheet.
- tapOn: "Close"

# Verify we are back on the Study screen.
- assertVisible: "Import Words"
