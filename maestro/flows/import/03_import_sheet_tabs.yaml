appId: com.alirezaiyan.vokab
tags:
  - import
  - method-chooser
---
# Test: the chooser lists every way to add words, and Back returns to it.
- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/open_add_words.yaml

- assertVisible: "Type a word"
- assertVisible: "Import a file"
- assertVisible: "Scan a photo"
- assertVisible: "Generate with AI"

- tapOn: "Type a word"
- runFlow: ../utils/pick_add_words_languages.yaml
- extendedWaitUntil:
    visible: "Add Word"
    timeout: 5000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Import a file"
    timeout: 5000

- tapOn: "Import a file"
- extendedWaitUntil:
    visible: "Choose a file"
    timeout: 5000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Type a word"
    timeout: 5000

- tapOn: "Close"
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
