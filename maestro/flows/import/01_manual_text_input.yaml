appId: com.alirezaiyan.vokab
tags:
  - import
  - manual-input
---
# Test: add a word by typing it, then try the same word again.
#
# open sheet → "Type a word" → fill word/translation/note → Add Word → word is
# listed under "Added this session" → same word again (different case) is
# refused with "You already have this word." → Done → result page → Done.

- evalScript: ${output.importWord = 'Import' + Date.now()}

- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/open_add_words.yaml
- tapOn: "Type a word"
- runFlow: ../utils/pick_add_words_languages.yaml

- extendedWaitUntil:
    visible: "Translation"
    timeout: 5000
- assertVisible: "Word"
- assertVisible: "Note · optional"

- tapOn: "Word"
- waitForAnimationToEnd
- eraseText: 50
- inputText: "${output.importWord}"
- tapOn: "Translation"
- waitForAnimationToEnd
- eraseText: 50
- inputText: "TestImport"
- tapOn: "Note · optional"
- waitForAnimationToEnd
- inputText: "Added by Maestro import test"

- tapOn: "Add Word"
- extendedWaitUntil:
    visible: "Added this session"
    timeout: 8000
- assertVisible: "${output.importWord} · TestImport"

# Same word, different case: it's a duplicate and is not added again.
- tapOn: "Word"
- waitForAnimationToEnd
- eraseText: 50
- inputText: "${output.importWord.toLowerCase()}"
- tapOn: "Translation"
- waitForAnimationToEnd
- eraseText: 50
- inputText: "testimport"
- tapOn: "Add Word"
- extendedWaitUntil:
    visible: "You already have this word."
    timeout: 8000

- tapOn: "Done"
- extendedWaitUntil:
    visible: "1 word added"
    timeout: 5000
- assertVisible: "Start Review"
- assertVisible: "Add more words"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
