appId: com.alirezaiyan.vokab
tags:
  - import
  - file-import
---
# Test: the file import page shows the picker and the format help.
- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/open_add_words.yaml
- tapOn: "Import a file"
- runFlow: ../utils/pick_add_words_languages.yaml

- extendedWaitUntil:
    visible: "Choose a file"
    timeout: 5000
- assertVisible: "Bring in a whole list at once from a text or CSV file."
- assertVisible: "How to format it"
- assertVisible: "word,translation"
- assertVisible: "word,translation,description"
- assertVisible: "Commas, semicolons or tabs all work"
- assertVisible: "Choose File"

- tapOn: "Close"
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
