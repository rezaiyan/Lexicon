appId: com.alirezaiyan.vokab
tags:
  - import
  - tags
---
# Test: the tag row and the create-tag page appear while typing words.
- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/open_add_words.yaml
- tapOn: "Type a word"
- runFlow: ../utils/pick_add_words_languages.yaml

- extendedWaitUntil:
    visible: "Add Word"
    timeout: 5000
- assertVisible: "None"
- assertVisible: "New Tag"

- tapOn: "New Tag"
- extendedWaitUntil:
    visible: "Tag name"
    timeout: 5000
- assertVisible: "Create Tag"
- assertVisible: "Cancel"
- tapOn: "Cancel"
- waitForAnimationToEnd
- assertVisible: "None"

- tapOn: "Close"
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
