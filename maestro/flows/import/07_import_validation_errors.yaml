appId: com.alirezaiyan.vokab
tags:
  - import
  - validation
---
# Test: nothing is added while the word or translation is missing.
- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/open_add_words.yaml
- tapOn: "Type a word"
- runFlow: ../utils/pick_add_words_languages.yaml

- extendedWaitUntil:
    visible: "Add Word"
    timeout: 5000

# Both fields empty.
- tapOn: "Add Word"
- assertNotVisible: "Added this session"

# Word only, no translation.
- tapOn: "Word"
- waitForAnimationToEnd
- eraseText: 50
- inputText: "TestValidation"
- tapOn: "Add Word"
- assertNotVisible: "Added this session"

- tapOn: "Close"
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
