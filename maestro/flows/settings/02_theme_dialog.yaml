appId: com.alirezaiyan.vokab
tags:
  - settings
---
# Test: Theme dialog opens and can be dismissed.
#
# Verifies that tapping the Theme card opens the theme selection dialog
# and that the dialog can be dismissed.

- launchApp:
    clearState: false

- runFlow: ../utils/navigate_to_settings.yaml

# Tap the Theme card to open the theme dialog.
- tapOn: "Theme"

# The dialog should show theme options. "Customize appearance" is the subtitle,
# so we look for the dialog content instead.
- assertVisible:
    text: "Light"
    optional: true
- assertVisible:
    text: "Dark"
    optional: true
- assertVisible:
    text: "Auto"
    optional: true

# Dismiss the dialog by pressing back.
- pressKey: back

# Settings screen should still be visible.
- assertVisible: "Settings"
