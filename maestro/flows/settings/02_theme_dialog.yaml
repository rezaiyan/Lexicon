appId: com.alirezaiyan.vokab
tags:
  - settings
---
# Test: Theme bottom sheet opens and can be dismissed.
#
# Verifies that tapping the Theme card opens the theme selection bottom sheet
# and that the sheet can be dismissed.

- runFlow: ../utils/navigate_to_settings.yaml

# Tap the Theme card to open the theme bottom sheet.
- tapOn: "Theme"

# Wait for the bottom sheet to open.
- waitForAnimationToEnd

# "Light" and "Dark" are universal options that must always be present.
- assertVisible: "Light"
- assertVisible: "Dark"

# "Automatic" follows the system setting — always present on both platforms.
- assertVisible: "Automatic"

# Dismiss the bottom sheet by pressing back.
- pressKey: back

# Wait for the sheet dismiss animation to complete.
- waitForAnimationToEnd

# Theme options must no longer be visible (sheet is gone).
- assertNotVisible: "Light"

# Settings screen should still be visible.
- assertVisible: "Theme"
