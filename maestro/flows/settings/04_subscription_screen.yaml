appId: com.alirezaiyan.vokab
tags:
  - settings
  - subscription
---
# Test: Subscription screen opens from Settings and renders the active-subscriber UI.
#
# The CI test user has an active subscription, so the screen shows
# SubscriptionActiveContent with "Manage Subscription" and an "Active" badge —
# not the paywall ("Unlock Premium" / "Restore My Purchases").
# Does NOT trigger actual purchases.

- runFlow: ../utils/navigate_to_settings.yaml

# The Subscription card must be visible on the Settings screen.
- assertVisible: "Subscription"

# Tap the Subscription card.
- tapOn: "Subscription"

- waitForAnimationToEnd

# "Manage Subscription" is the button shown for active subscribers.
# Waiting for it confirms the subscription screen opened for an active user.
- extendedWaitUntil:
    visible: "Manage Subscription"
    timeout: 10000

# The "Active" badge must be visible confirming the subscription is active.
- assertVisible: "Active"

# Dismiss by pressing the system back button.
- pressKey: back

- waitForAnimationToEnd

# "Manage Subscription" must no longer be visible (screen is gone).
- assertNotVisible: "Manage Subscription"

# We should be back on the Settings screen.
- extendedWaitUntil:
    visible: "Subscription"
    timeout: 5000
