appId: com.alirezaiyan.vokab
tags:
  - settings
  - subscription
---
# Test: the Subscription screen opens from the Profile tab and back returns there.
#
# The CI account's premium is granted by the backend (not bought in a store), so the
# member view shows the "Granted" badge and "Granted until" date, with nothing to manage.

- runFlow: ../utils/navigate_to_profile.yaml

- tapOn: "Subscription"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Granted until"
    timeout: 10000
- assertVisible: "Granted"

- pressKey: back
- waitForAnimationToEnd

- assertNotVisible: "Granted until"
- extendedWaitUntil:
    visible: "Edit Profile"
    timeout: 5000
