appId: com.alirezaiyan.vokab
tags:
  - settings
  - subscription
---
# Test: the Subscription screen opens from the Profile tab and back returns there.
#
# Assumes a premium test account (the member view shows "Active" and the
# "Manage in Google Play" link).

- runFlow: ../utils/navigate_to_profile.yaml

- tapOn: "Subscription"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Manage in Google Play"
    timeout: 10000
- assertVisible: "Active"

- pressKey: back
- waitForAnimationToEnd

- assertNotVisible: "Manage in Google Play"
- extendedWaitUntil:
    visible: "Logout"
    timeout: 5000
