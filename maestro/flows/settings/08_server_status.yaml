appId: com.alirezaiyan.vokab
tags:
  - settings
---
# Test: Settings opens with the live connection row on top.
#
# Online here; the offline / server-down wording is covered by unit tests, since a
# flow can't take the network away without adb.

- runFlow: ../utils/navigate_to_settings.yaml

- assertVisible: "Connection"
- extendedWaitUntil:
    visible: "Connected to Lexicon"
    timeout: 15000

# Tapping re-checks and settles back on connected
- tapOn: "Connected to Lexicon"
- extendedWaitUntil:
    visible: "Connected to Lexicon"
    timeout: 15000
