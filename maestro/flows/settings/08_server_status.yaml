appId: com.alirezaiyan.vokab
tags:
  - settings
---
# Test: while connected, Settings shows no connection notice at all.
#
# The offline / server-down notice is covered by unit tests, since a flow can't
# take the network away without adb.

- runFlow: ../utils/navigate_to_settings.yaml

- assertVisible: "Daily Goal"
- assertNotVisible: "You're offline"
- assertNotVisible: "Can't reach Lexicon's server"
- assertNotVisible: "Retry"
