appId: com.alirezaiyan.vokab
tags:
  - settings
  - smoke
---
# Test: Settings screen loads with its cards.
#
# Settings opens from the Study screen's top bar. Word Manager is the Words tab
# and Subscription lives on the Profile tab, so neither card is here.

- runFlow: ../utils/navigate_to_settings.yaml

- assertVisible: "Settings"
- assertVisible: "Daily Goal"
- assertVisible: "Notifications"
- assertVisible: "Tag Manager"
- assertVisible: "TTS Models"
- assertVisible: "Theme"

- scrollUntilVisible:
    element: "About"
    direction: DOWN
    timeout: 3000

- assertNotVisible: "Word Manager"
