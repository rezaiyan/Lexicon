appId: com.alirezaiyan.vokab
tags:
  - insights
  - smoke
---
# Test: the Insights tab loads its value blocks.
#
# The test account has words and review history, so the week summary
# (from the server) and the local blocks (forecast, words) all render.

- runFlow: ../utils/navigate_to_study.yaml

- tapOn: "(?-i)Insights"

# The week summary comes from the server; 15 s allows for slow network on CI.
- extendedWaitUntil:
    visible: "This week"
    timeout: 15000

# Local blocks: upcoming reviews and the library by stage.
- scrollUntilVisible:
    element: "Coming up"
    direction: DOWN
    timeout: 8000
- scrollUntilVisible:
    element: "Mastered"
    direction: DOWN
    timeout: 8000

# Back to Study via its tab.
- tapOn: "(?-i)Study"
- extendedWaitUntil:
    visible: "Practice"
    timeout: 8000
