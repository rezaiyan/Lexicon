# Utility flow: add a single test word by typing it.
#
# Called by test flows that need at least one word to exist:
#   - runFlow: ../utils/add_test_word.yaml
#
# Each invocation uses a unique word (Date.now()), so the word is always new and
# immediately due for review.
#
# Assumes the app is on the Study screen and the add-words sheet is closed.
appId: com.alirezaiyan.vokab
---
- evalScript: ${output.word = 'Test' + Date.now()}

- runFlow: open_add_words.yaml
- tapOn: "Type a word"
- runFlow: pick_add_words_languages.yaml

- extendedWaitUntil:
    visible: "Translation"
    timeout: 5000

# eraseText before inputText makes Maestro establish the IME connection with
# Compose TextFields; without it inputText intermittently types nothing.
- tapOn: "Word"
- waitForAnimationToEnd
- eraseText: 50
- inputText: "${output.word}"
- tapOn: "Translation"
- waitForAnimationToEnd
- eraseText: 50
- inputText: "TestTranslation"

- tapOn: "Add Word"

# The session list appears once the word is saved.
- extendedWaitUntil:
    visible: "Added this session"
    timeout: 8000

# Done shows the result page; Close there closes the sheet.
- tapOn: "Done"
- extendedWaitUntil:
    visible: "1 word added"
    timeout: 5000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
