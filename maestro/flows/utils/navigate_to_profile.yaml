# Utility flow: navigate from the main app to the Profile screen.
#
# Called by profile test flows via:
#   - runFlow: ../utils/navigate_to_profile.yaml
#
# Assumes:
#   - The app is already running (launched by the calling flow).
#   - The user is authenticated and the main app is visible (Study/Settings/Profile tabs).
#   - The device is not in a dialog or overlay state.

appId: com.alirezaiyan.vokab
---
# Navigate to the Profile tab via the bottom navigation bar.
- tapOn:
    text: "Profile"

# Verify the Profile screen is open by checking the title.
- assertVisible: "Profile"
