# Utility flow: navigate from the main app to the Profile tab.
#
# Called by profile test flows via:
#   - runFlow: ../utils/navigate_to_profile.yaml
#
# Handles app restart to clear leftover overlays from prior tests.

appId: com.alirezaiyan.vokab
---
- stopApp
- launchApp:
    clearState: false

# Wait for the Study screen (handles splash + auth startup).
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 25000

# Profile is a bottom tab. Case-sensitive so it only matches the tab label.
- tapOn:
    text: "(?-i)Profile"

- extendedWaitUntil:
    visible: "Logout"
    timeout: 8000
