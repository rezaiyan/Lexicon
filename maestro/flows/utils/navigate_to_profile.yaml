# Utility flow: navigate from the main app to the Profile screen.
#
# Called by profile test flows via:
#   - runFlow: ../utils/navigate_to_profile.yaml
#
# Handles app restart to clear leftover overlays from prior tests.

appId: com.alirezaiyan.vokab
---
# Restart app to ensure a clean UI state (no leftover overlays from prior tests).
- stopApp
- launchApp:
    clearState: false

# Wait for the bottom navigation bar to load (handles splash + auth startup).
- extendedWaitUntil:
    visible: "Profile"
    timeout: 15000

# Navigate to the Profile tab via the bottom navigation bar.
- tapOn:
    text: "Profile"

# Verify the Profile screen is open by waiting for a Profile-specific element.
- extendedWaitUntil:
    visible: "Leaderboard"
    timeout: 5000
