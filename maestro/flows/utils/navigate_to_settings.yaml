# Utility flow: navigate from the main app to the Settings screen.
#
# Called by settings test flows via:
#   - runFlow: ../utils/navigate_to_settings.yaml
#
# Handles app restart to clear leftover overlays from prior tests.

appId: com.alirezaiyan.vokab
---
# Restart app to ensure a clean UI state (no leftover overlays from prior tests).
- stopApp
- launchApp:
    clearState: false

# Wait for the bottom navigation bar to load (handles splash + auth startup).
# 25s timeout accommodates slow CI emulators where auth + Compose init can be slow.
# Wait on an app-only element: right after launch the device launcher can still be
# on screen, and its "Settings" app icon would match a bare "Settings" selector.
- extendedWaitUntil:
    visible: "(?-i)Profile"
    timeout: 25000

# Open Settings via the gear on the Study screen (a top-bar icon, not a tab).
- tapOn:
    text: "Settings"

# Verify the Settings screen is open by waiting for a Settings-specific element.
- extendedWaitUntil:
    visible: "Theme"
    timeout: 5000
