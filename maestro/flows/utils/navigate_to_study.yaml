# Utility flow: navigate from the main app to the Study screen.
#
# Called by study and import test flows via:
#   - runFlow: ../utils/navigate_to_study.yaml
#
# Handles app restart to clear leftover overlays from prior tests.

appId: com.alirezaiyan.vokab
---
# Restart app to ensure a clean UI state (no leftover overlays from prior tests).
- stopApp
- launchApp:
    clearState: false

# Wait for the bottom navigation bar to load (handles splash + auth startup).
# 25s timeout accommodates slow CI emulators where auth + Compose init can be slow.
- extendedWaitUntil:
    visible: "Study"
    timeout: 25000

# Navigate to the Study tab via the bottom navigation bar.
- tapOn:
    text: "Study"

# Verify the Study screen is open by checking for the "Import Words" icon
# (content description on the + action icon, always present).
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
