# Utility flow: navigate from the main app to the Word Manager (the "Words" bottom tab).
#
# Called by word manager test flows via:
#   - runFlow: ../utils/navigate_to_word_manager.yaml
#
# Handles app restart to clear leftover overlays from prior tests.

appId: com.alirezaiyan.vokab
---
# Restart app to ensure a clean UI state (no leftover overlays from prior tests).
- stopApp
- launchApp:
    clearState: false

# Wait for the bottom navigation bar to load (handles splash + auth startup).
- extendedWaitUntil:
    visible: "(?-i)Words"
    timeout: 15000

# Case-sensitive: the Study screen's stage cards also show an uppercase "WORDS" label.
- tapOn:
    text: "(?-i)Words"

# Either the word list (search bar) or the empty library state.
- extendedWaitUntil:
    visible: "Search words\\.\\.\\.|Your word library is empty"
    timeout: 10000
