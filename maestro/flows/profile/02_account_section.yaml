  - smoke
---
# Test: the Profile tab lists the account actions.
#
# Subscription, Edit Profile and Logout sit on the Profile tab. Delete Account
# moved to the bottom of Settings so it stays out of the way.

- runFlow: ../utils/navigate_to_profile.yaml

- assertVisible: "Subscription"
- assertVisible: "Edit Profile"
- assertVisible: "Logout"
- assertNotVisible: "Delete Account"
