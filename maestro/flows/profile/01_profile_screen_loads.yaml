appId: com.alirezaiyan.vokab
tags:
  - profile
  - smoke
---
# Test: Profile sheet loads with core UI elements visible.
#
# Verifies that opening the Profile sheet shows user info
# and the Logout button when logged in.

- runFlow: ../utils/navigate_to_profile.yaml

# The Logout button must be visible (may require scrolling past several sections).
- scrollUntilVisible:
    element: "Logout"
    direction: DOWN
    timeout: 8000
