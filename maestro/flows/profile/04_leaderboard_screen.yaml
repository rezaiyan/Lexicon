appId: com.alirezaiyan.vokab
tags:
  - profile
  - leaderboard
---
# Test: Leaderboard opens from the Study Insights tab and can be dismissed.
#
# The Insights tab (premium only) has a Leaderboard icon in its top bar. The
# leaderboard opens as a fullscreen overlay with dismissOnBackPress=false, so it
# is dismissed via the back arrow in its top bar.

- stopApp
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Import Words"
    timeout: 25000

- tapOn: "Study Insights"
- waitForAnimationToEnd

- tapOn: "Leaderboard"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Refresh"
    timeout: 10000
- assertVisible: "Leaderboard"

# The system nav bar's back button is also labelled "Back" and would match first; system back
# does nothing here (dismissOnBackPress=false). The top-bar arrow is the only "Back" above the
# ranking card ("Leaderboard" is no anchor: the Insights button under the overlay matches too).
- extendedWaitUntil:
    visible: "Your Ranking"
    timeout: 10000
- tapOn:
    text: "Back"
    above: "Your Ranking"
- waitForAnimationToEnd

- assertNotVisible: "Refresh"
- assertVisible: "Study Insights"
