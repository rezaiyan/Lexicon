appId: com.alirezaiyan.vokab
tags:
  - profile
  - leaderboard
---
# Test: Leaderboard opens from the Study Insights tab and can be dismissed.
#
# The Insights tab (premium only) has a Leaderboard icon in its top bar. The
# leaderboard opens as a fullscreen overlay with dismissOnBackPress=false, so it
# is dismissed via the back arrow in its top bar.

- stopApp
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Import Words"
    timeout: 25000

- tapOn: "Study Insights"
- waitForAnimationToEnd

- tapOn: "Leaderboard"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Refresh"
    timeout: 10000
- assertVisible: "Leaderboard"

- tapOn: "Back"
- waitForAnimationToEnd

- assertNotVisible: "Refresh"
- assertVisible: "Study Insights"
