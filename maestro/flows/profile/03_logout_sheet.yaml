appId: com.alirezaiyan.vokab
tags:
  - profile
  - logout
---
# Test: Logout bottom sheet opens and can be dismissed.
#
# Verifies that tapping "Logout" on the profile screen opens a
# confirmation bottom sheet, and that tapping "Cancel" dismisses it
# without logging out.

- launchApp:
    clearState: false

- runFlow: ../utils/navigate_to_profile.yaml

# Scroll to the Logout button (may require scrolling past several sections).
- scrollUntilVisible:
    element: "Logout"
    direction: DOWN
    timeout: 8000

# Tap the Logout button (retry if needed — scroll may still be settling).
- tapOn:
    text: "Logout"
    retryTapIfNoChange: true

# Wait for the bottom sheet animation to complete.
- waitForAnimationToEnd

# The logout confirmation sheet must appear.
# Wait for "Cancel" — exact node text unique to the sheet (not on the profile screen).
# 10s timeout: the sheet open animation + Compose render can be slow on CI emulators.
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000

# The confirm Logout button must also be visible in the sheet.
- assertVisible:
    text: "Logout"

# Dismiss without logging out by tapping Cancel.
- tapOn: "Cancel"

# Wait for the dismiss animation to complete.
- waitForAnimationToEnd

# Sheet must be gone — the confirmation Cancel button should no longer be visible.
- assertNotVisible:
    text: "Cancel"

# We should still be on the Profile screen with the user logged in.
- extendedWaitUntil:
    visible: "Profile"
    timeout: 5000
- assertVisible: "Leaderboard"
