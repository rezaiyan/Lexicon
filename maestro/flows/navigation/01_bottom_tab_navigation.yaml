appId: com.alirezaiyan.vokab
tags:
  - navigation
  - smoke
---
# Test: Bottom tab navigation works across all tabs.
#
# Tabs: Study, Words, Study Insights (premium only) and Profile. Tab labels are
# matched case-sensitively: the Study screen also shows an uppercase "WORDS".

- stopApp
- launchApp:
    clearState: false

# 25s timeout: consistent with navigate_to_* utils — accommodates slow CI emulators.
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 25000

- tapOn:
    text: "(?-i)Words"
- extendedWaitUntil:
    visible: "Search words\\.\\.\\.|Your word library is empty"
    timeout: 5000

- runFlow:
    when:
      visible: "Study Insights"
    commands:
      - tapOn: "Study Insights"
      - extendedWaitUntil:
          visible: "Leaderboard"
          timeout: 5000

- tapOn:
    text: "(?-i)Profile"
- extendedWaitUntil:
    visible: "Logout"
    timeout: 5000

# Round-trip back to Study.
- tapOn:
    text: "(?-i)Study"
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
