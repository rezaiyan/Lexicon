appId: com.alirezaiyan.vokab
tags:
  - navigation
  - smoke
---
# Test: Bottom tab navigation works across all tabs.
#
# Verifies that tapping each bottom navigation tab loads the corresponding
# screen. The app has three tabs: Profile, Study, and Settings.

- stopApp
- launchApp:
    clearState: false

# Wait for the app to fully load and show bottom navigation.
# 25s timeout: consistent with navigate_to_* utils — accommodates slow CI emulators.
- extendedWaitUntil:
    visible: "Study"
    timeout: 25000

# Navigate to Study tab.
- tapOn:
    text: "Study"
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000

# Navigate to Settings tab.
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible: "Theme"
    timeout: 5000

# Navigate to Profile tab.
- tapOn:
    text: "Profile"
- extendedWaitUntil:
    visible: "Leaderboard"
    timeout: 5000

# Navigate back to Study tab to verify round-trip.
- tapOn:
    text: "Study"
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
