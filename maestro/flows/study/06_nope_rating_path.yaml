appId: com.alirezaiyan.vokab
tags:
  - study
  - review
  - nope
---
# Unique per run: tags live on the backend, and a name left over from an aborted run
# makes the create request fail as a duplicate. Tags are listed by name, so the
# '0test' + countdown prefix puts the newest test tag in the first row, above leftovers.
- evalScript: ${output.tag = '0test' + (9999999999 - Math.floor(Date.now() / 1000)) + 'nope'}
# Test: Review session completes normally when all cards are rated "Nope".
#
# Uses a tag-filtered 1-word session to avoid the ~15-minute loop previously
# needed to exhaust all accumulated words in the test account.
#
# "Nope" (hard/again) re-queues the card at the back of the session, so the
# session completes after a small number of iterations. A 20-iteration loop
# handles any re-queuing without risk of timeout.
#
# Flow:
#   Setup   — create "NopeTag", add test word, assign "NopeTag" to it
#   Test    — tap "Start Review" → select "NopeTag" → flip →
#             rate "Nope" in loop until "Done" appears → tap "Done"
#   Teardown — delete "NopeTag"

# ── Setup: Create tag ─────────────────────────────────────────────────────────

- runFlow: ../utils/navigate_to_settings.yaml

- scrollUntilVisible:
    element: "Tag Manager"
    direction: DOWN
    timeout: 5000

- tapOn: "Tag Manager"

- extendedWaitUntil:
    visible: "Tag Manager"
    timeout: 8000

- tapOn: "New Tag"

- extendedWaitUntil:
    visible: "New Tag"
    timeout: 5000

- runFlow:
    file: ../utils/type_tag_name.yaml
    env:
      NAME: "${output.tag}"
- hideKeyboard

- tapOn: "Create Tag"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "${output.tag}"
    timeout: 5000

# Close Tag Manager (dismissOnBackPress=false — must tap Close).
- tapOn: "Close"

- extendedWaitUntil:
    visible: "Theme"
    timeout: 5000

# ── Setup: Add a test word ────────────────────────────────────────────────────

- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/add_test_word.yaml

# ── Setup: Assign tag to the test word ───────────────────────────────────────

- runFlow: ../utils/navigate_to_word_manager.yaml

- extendedWaitUntil:
    visible: "Search words..."
    timeout: 15000

# Open the detail sheet for the test word.
- tapOn: "${output.word}"

# Wait for the detail sheet to appear.
- assertVisible: "Learning Progress"

# Open tag assignment.
- tapOn: "Assign Tag"

- extendedWaitUntil:
    visible: "Assign Tag"
    timeout: 8000

# Select the "NopeTag" chip.
- assertVisible: "${output.tag}"
- tapOn: "${output.tag}"
- waitForAnimationToEnd

# Save the assignment. index 1: the page title (index 0) also reads
# "Assign Tag"; the save button is index 1.
- tapOn:
    text: "Assign Tag"
    index: 1
- waitForAnimationToEnd

# Wait for the Assign Tag sheet to dismiss and detail sheet to reappear.
- extendedWaitUntil:
    visible: "Learning Progress"
    timeout: 5000

# Dismiss the detail sheet.
- pressKey: back

# ── Test: Tag-filtered review completes with "Nope" ratings ──────────────────

- runFlow: ../utils/navigate_to_study.yaml

# Wait for "Start Review" to appear.
- extendedWaitUntil:
    visible: "Start Review"
    timeout: 8000

# With tags that have due words, tapping "Start Review" asks which to review
# (long-press skips the question).
- tapOn: "Start Review"

# The picker sheet offers every due word or a single tag.
- extendedWaitUntil:
    visible: "All due words"
    timeout: 8000

# "NopeTag" must be listed.
- assertVisible: "${output.tag}"

# Tap the tag to start a 1-word tag-filtered review.
- tapOn: "${output.tag}"
- waitForAnimationToEnd

# The review card must appear.
- extendedWaitUntil:
    visible: "Tap card to reveal"
    timeout: 8000

# Flip the first card.
- tapOn:
    point: "50%,40%"

- waitForAnimationToEnd

# Rate the card as "Nope".
- tapOn: "Nope"
- waitForAnimationToEnd

# Continue flipping and rating "Nope" until the completion screen appears.
# With 1 word, the SRS may re-queue it a few times before completing the session.
- repeat:
    times: 20
    while:
      notVisible: "Done"
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,40%"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Nope"
          optional: true

# The completion screen must now be visible.
- assertVisible: "Done"

# Performance stats must be visible (Remembered label is always shown).
- assertVisible: "Remembered"

# Tap "Done" to dismiss the completion screen.
- tapOn: "Done"

# We should be back on the Study screen.
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000

# ── Teardown: Delete "NopeTag" ────────────────────────────────────────────────

- runFlow: ../utils/navigate_to_settings.yaml

- scrollUntilVisible:
    element: "Tag Manager"
    direction: DOWN
    timeout: 5000

- tapOn: "Tag Manager"

- extendedWaitUntil:
    visible: "${output.tag}"
    timeout: 8000

# Our tag is the first row, so the first trash icon is its own.
- tapOn: "Delete Tag"

- extendedWaitUntil:
    visible: "Delete this tag? Words with this tag will not be deleted."
    timeout: 5000
- waitForAnimationToEnd

# The dialog title and its confirm button share the text; index 1 is the button.
- tapOn:
    text: "Delete Tag"
    index: 1
- waitForAnimationToEnd

# Other tags may exist on the test account; only ours must be gone.
- assertNotVisible: "${output.tag}"

# Close Tag Manager.
- tapOn: "Close"

- extendedWaitUntil:
    visible: "Theme"
    timeout: 5000
