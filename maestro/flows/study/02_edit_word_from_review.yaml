appId: com.alirezaiyan.vokab
tags:
  - study
  - review
  - edit
---
# Test: Edit a word from the review flow.
#
# Full flow: Study → Start Review → review sheet opens →
# tap card to flip → tap "Edit" → EditWordDialog opens → modify Original Word →
# tap "Save" → dialog closes → close review → confirm exit.
#
# Requires: At least one word exists in the library (import tests or add_test_word
# must have run before this test).

- launchApp:
    clearState: false

- runFlow: ../utils/navigate_to_study.yaml

# Add a test word so we have something to review.
- runFlow: ../utils/add_test_word.yaml

# Tap "Start Review" to begin the review session.
- tapOn: "Start Review"

# The review sheet should open. Wait for the "Tap card to reveal" hint.
- assertVisible: "Tap card to reveal"

# Tap the card area to flip it (center of the card).
- tapOn:
    point: "50%,40%"

# Wait for the flip animation to complete.
- waitForAnimationToEnd

# After flipping, the rating section should appear.
- assertVisible: "Did you get it?"

# Tap "Edit" below the card to open the EditWordDialog.
# The Edit button is a small Row; use scrollUntilVisible then tap to ensure accuracy.
- tapOn:
    text: "Edit"
    retryTapIfNoChange: true

# The Edit Word dialog must be visible.
- assertVisible: "Edit Word"

# The "Original Word" field should contain our test word.
- assertVisible: "Original Word"

# Clear the field and type a modified value.
- tapOn: "Original Word"
- eraseText: 20
- inputText: "MaestroEdited"

# Hide the keyboard so "Save" button is visible.
- hideKeyboard

# Tap "Save" to save the changes.
- tapOn: "Save"

# The dialog must close — "Edit Word" title should no longer be visible.
- assertNotVisible: "Edit Word"

# Close the review by tapping the close icon (content description: "Close").
- tapOn: "Close"

# The exit confirmation dialog must appear.
- assertVisible: "Exit Review?"

# Confirm exit.
- tapOn: "Yes, Exit"

# We should be back on the Study screen.
- assertVisible: "Import Words"
