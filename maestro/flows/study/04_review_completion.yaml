appId: com.alirezaiyan.vokab
tags:
  - study
  - review
  - completion
---
# Test: Review completion screen appears after reviewing all cards.
#
# Flow: Study → add test word → Start Review → flip → rate "Got it!" →
# completion screen appears with stats → tap "Done" → back to Study screen.
#
# Requires: The add_test_word utility must work to ensure at least one word.
# Note: The test account may have accumulated many words from server sync and
# previous test runs. The loop count must be high enough to exhaust all due cards.

- runFlow: ../utils/navigate_to_study.yaml

# Add a test word so we have at least one word to review.
- runFlow: ../utils/add_test_word.yaml

# Start a review session.
- tapOn: "Start Review"

# Wait for the review card to appear.
- assertVisible: "Tap card to reveal"

# Flip the card.
- tapOn:
    point: "50%,40%"

- waitForAnimationToEnd

# Rate the card as remembered.
- tapOn: "Got it!"
- waitForAnimationToEnd

# The test account may have multiple words due to server sync.
# Keep flipping and rating cards until the completion screen ("Done") appears.
# Using 100 iterations to handle accounts with many accumulated test words.
#
# Loop body order: wait for card transition → flip → wait → rate.
# The waitForAnimationToEnd before the flip tap is required: after a rating, the
# SRS deck animator transitions to the next card with a brief intermediate state
# where neither "Tap card to reveal" nor "Got it!" is visible. Waiting here
# prevents the flip tap from landing on an element mid-animation.
- repeat:
    times: 100
    while:
      notVisible: "Done"
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,40%"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Got it!"
          optional: true

# The completion screen must now be visible.
- assertVisible: "Done"

# The completion screen should appear with performance stats.
# One of the tier titles must be visible (depends on performance).
- assertVisible:
    text: "Perfect Score!"
    optional: true
- assertVisible:
    text: "Outstanding!"
    optional: true
- assertVisible:
    text: "Solid Session!"
    optional: true

# The "Remembered" stat label must be visible.
- assertVisible: "Remembered"

# Tap "Done" to dismiss the completion screen.
- tapOn: "Done"

# We should be back on the Study screen (wait for the + icon to render).
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
