---
# Test: Word Rush card is visible on the Study screen.
#
# Verifies that the Word Rush card appears above the Learning Stages section
# with the correct title, subtitle, and Play button. Requires at least 4 words
# to exist (import tests run before study tests).

- runFlow: ../utils/navigate_to_study.yaml

# The Word Rush card title must be visible.
- assertVisible: "Word Rush"

# The tile subtitle must show the combo hint or best streak, not the "add words" prompt.
- assertNotVisible: "Add at least 4 words to play"

# Take a screenshot of the study screen showing the Word Rush card.
- takeScreenshot: screenshots/word_rush_card_on_study
