appId: com.alirezaiyan.vokab
tags:
  - study
  - tags
  - review
---
# Unique per run: tags live on the backend, and a name left over from an aborted run
# makes the create request fail as a duplicate. Tags are listed by name, so the
# '0test' + countdown prefix puts the newest test tag in the first row, above leftovers.
- evalScript: ${output.tag = '0test' + (9999999999 - Math.floor(Date.now() / 1000)) + 'filter'}
# Test: Tapping "Start Review" on the Study screen opens a tag-filter
# picker sheet when at least one tag with assigned words exists.  Selecting a
# tag launches a tag-filtered review session.
#
# Setup
#   1. Create tag "TestFilterTag" via Settings → Tag Manager.
#   2. Add a test word via the import sheet.
#   3. Assign "TestFilterTag" to the test word via Word Manager.
#
# Test
#   4. Tap "Start Review" on the Study screen.
#   5. Verify the "Tags" picker sheet appears with "TestFilterTag" listed.
#   6. Tap "TestFilterTag" → review opens.
#   7. Close the review immediately (no cards rated).
#
# Teardown
#   8. Delete "TestFilterTag" via Settings → Tag Manager so the account is
#      clean for subsequent tests.

# ── Setup: Create tag ─────────────────────────────────────────────────────────

- runFlow: ../utils/navigate_to_settings.yaml

- scrollUntilVisible:
    element: "Tag Manager"
    direction: DOWN
    timeout: 5000

- tapOn: "Tag Manager"

- extendedWaitUntil:
    visible: "Tag Manager"
    timeout: 8000

- tapOn: "New Tag"

- extendedWaitUntil:
    visible: "New Tag"
    timeout: 5000

- runFlow:
    file: ../utils/type_tag_name.yaml
    env:
      NAME: "${output.tag}"
- hideKeyboard

- tapOn: "Create Tag"
- waitForAnimationToEnd

# Tag appears in the list.
- assertVisible: "${output.tag}"

# Close Tag Manager.
# pressKey: back does NOT work — Tag Manager uses dismissOnBackPress=false.
- tapOn: "Close"

- extendedWaitUntil:
    visible: "Theme"
    timeout: 5000

# ── Setup: Add a test word ────────────────────────────────────────────────────

- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/add_test_word.yaml

# ── Setup: Assign tag to the test word ───────────────────────────────────────

- runFlow: ../utils/navigate_to_word_manager.yaml

- extendedWaitUntil:
    visible: "Search words..."
    timeout: 15000

# Open the detail sheet for the test word.
- tapOn: "${output.word}"

# Wait for the detail sheet to appear.
- assertVisible: "Learning Progress"

# Open tag assignment.
- tapOn: "Assign Tag"

- extendedWaitUntil:
    visible: "Assign Tag"
    timeout: 8000

# "TestFilterTag" chip must be present (wordCount=0 so shows plain name).
- assertVisible: "${output.tag}"

# Select the chip.
- tapOn: "${output.tag}"
- waitForAnimationToEnd

# Save the assignment. index 1: the page title (index 0) also reads
# "Assign Tag"; the save button is index 1.
- tapOn:
    text: "Assign Tag"
    index: 1
- waitForAnimationToEnd

# Wait for the Assign Tags sheet to fully dismiss before asserting the detail sheet.
# The sheet dismissal is animated — without this second wait the detail sheet
# assertion fires before the dismiss animation completes.
- extendedWaitUntil:
    visible: "Learning Progress"
    timeout: 5000

# Dismiss the detail sheet.
- pressKey: back

# ── Test: Tap "Start Review" opens tag picker ─────────────────────────

- runFlow: ../utils/navigate_to_study.yaml

# Wait for the "Start Review" button to be visible (due cards exist).
- extendedWaitUntil:
    visible: "Start Review"
    timeout: 8000

# With tags that have due words, tapping "Start Review" asks which to review
# (long-press skips the question).
- tapOn: "Start Review"

# The picker sheet offers every due word or a single tag.
- extendedWaitUntil:
    visible: "All due words"
    timeout: 8000

# "TestFilterTag" must appear (wordCount > 0 after assignment).
- assertVisible: "${output.tag}"

# Tap the tag to start a tag-filtered review.
- tapOn: "${output.tag}"
- waitForAnimationToEnd

# The review screen must open — first card is face-down.
- extendedWaitUntil:
    visible: "Tap card to reveal"
    timeout: 8000

# Close the review without rating any cards.
- tapOn: "Close"

- extendedWaitUntil:
    visible: "Exit Review?"
    timeout: 5000

# The sheet's confirm button is "Continue Reviewing"; "Stop review" leaves the session.
- tapOn: "Stop review"

- waitForAnimationToEnd

# Back on the Study screen.
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 8000

# ── Teardown: Delete "TestFilterTag" ─────────────────────────────────────────

- runFlow: ../utils/navigate_to_settings.yaml

- scrollUntilVisible:
    element: "Tag Manager"
    direction: DOWN
    timeout: 5000

- tapOn: "Tag Manager"

- extendedWaitUntil:
    visible: "${output.tag}"
    timeout: 8000

# Our tag is the first row, so the first trash icon is its own.
- tapOn: "Delete Tag"

- extendedWaitUntil:
    visible: "Delete this tag? Words with this tag will not be deleted."
    timeout: 5000
- waitForAnimationToEnd

# The dialog title and its confirm button share the text; index 1 is the button.
- tapOn:
    text: "Delete Tag"
    index: 1
- waitForAnimationToEnd

# Other tags may exist on the test account; only ours must be gone.
- assertNotVisible: "${output.tag}"

# Close Tag Manager.
# pressKey: back does NOT work — Tag Manager uses dismissOnBackPress=false.
- tapOn: "Close"

- extendedWaitUntil:
    visible: "Theme"
    timeout: 5000
