appId: com.alirezaiyan.vokab
tags:
  - word-manager
  - smoke
  - navigation
---
# Test: the Words tab (Word Manager) loads, and switching tabs returns to it.
#
# Passes whether the word library is empty or populated. The search bar and
# selection bar only exist when words exist (see 02_empty_state.yaml and
# 03_search_functionality.yaml for state-specific coverage).

- runFlow: ../utils/navigate_to_word_manager.yaml

# Either the empty state or the word list must be shown.
- assertVisible:
    text: "Your word library is empty"
    optional: true
- assertVisible:
    text: "Search words..."
    optional: true

# --- Tab round-trip ---
- tapOn: "Study"
- extendedWaitUntil:
    visible: "Import Words"
    timeout: 5000
- assertNotVisible: "Search words..."

- tapOn:
    text: "(?-i)Words"
- extendedWaitUntil:
    visible: "Search words\\.\\.\\.|Your word library is empty"
    timeout: 5000
