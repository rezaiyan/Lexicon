appId: com.alirezaiyan.vokab
tags:
  - word-manager
  - delete
---
# Test: The delete confirmation dialog appears when words are selected and the
# Delete icon is tapped. Cancelling the dialog discards the action.
#
# Creates a test word first to ensure at least one word exists in the library.

# Navigate to Study screen and add a test word so the library is non-empty.
- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/add_test_word.yaml

# Now navigate to the Word Manager.
- runFlow: ../utils/navigate_to_word_manager.yaml

# Verify we are in the word list state.
- assertVisible: "Search words..."

# Long press the test word to enter selection mode.
- longPressOn:
    text: "${output.word}"

# The bottom selection bar must appear.
- assertVisible:
    text: ".*selected.*"

# Tap "Select All" to select all words.
- tapOn: "Select All"

# At least one word should now be selected (counter contains "selected").
- assertVisible:
    text: ".*selected.*"

# Tap the Delete icon in the selection bar (content description "Delete").
- tapOn: "Delete"

# The delete confirmation dialog must appear.
- assertVisible: "Delete Words?"

# The Cancel button must be present to dismiss without deleting.
- assertVisible: "Cancel"

# Dismiss — do NOT actually delete words.
- tapOn: "Cancel"

# Wait for the dialog dismiss animation AND the selection bar exit animation.
# Both animate concurrently after cancel; a single waitForAnimationToEnd may
# return before the selection bar collapses if the dialog fades faster.
- waitForAnimationToEnd
- waitForAnimationToEnd

# The dialog must be dismissed.
- assertNotVisible: "Delete Words?"

# Cancelling the delete dialog should also exit selection mode.
- assertNotVisible:
    text: ".*selected.*"

# The word list must still be intact.
- assertVisible: "Search words..."
