appId: com.alirezaiyan.vokab
tags:
  - word-manager
  - tags
---
# Test: a tag can be assigned to a word from the word detail sheet, even when
# the user has no tags yet.
#
# Regression: the "Assign Tag" page used to be a dead end without tags — it only
# showed "No tags yet" and a disabled save button. It now offers "New Tag"; a tag
# created there is selected for the word straight away.
#
# Setup:    add a unique test word.
# Test:     word detail → Assign Tag → New Tag → create → Assign Tag → the tag
#           shows on the detail sheet.
# Teardown: delete the created tag via Settings → Tag Manager.

- evalScript: ${output.tag = 'Tag' + Date.now()}

# ── Setup: Add a test word ────────────────────────────────────────────────────

- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/add_test_word.yaml

- runFlow: ../utils/navigate_to_word_manager.yaml
- extendedWaitUntil:
    visible: "Search words..."
    timeout: 15000

# ── Test: Create and assign a tag from the detail sheet ──────────────────────

- tapOn: "${output.word}"
- assertVisible: "Learning Progress"

- tapOn: "Assign Tag"

# The assignment page offers to create a tag, whatever tags already exist.
- extendedWaitUntil:
    visible: "New Tag"
    timeout: 8000
# The word is shown as context below the title.
- assertVisible: "${output.word}"

- tapOn: "New Tag"
- extendedWaitUntil:
    visible: "Tag name"
    timeout: 5000

# eraseText before inputText makes Maestro establish the IME connection.
- tapOn: "Tag name"
- waitForAnimationToEnd
- eraseText: 50
- inputText: "${output.tag}"
- hideKeyboard

- tapOn: "Create Tag"
- waitForAnimationToEnd

# Back on the checklist with the new tag listed (and already ticked: saving
# without tapping it must assign it, asserted on the detail page below).
- extendedWaitUntil:
    visible: "${output.tag}"
    timeout: 8000

# Save.
- tapOn: "Assign Tag"
- waitForAnimationToEnd

# Back on the detail page, which now lists the assigned tag.
- extendedWaitUntil:
    visible: "Learning Progress"
    timeout: 8000
- assertVisible: "${output.tag}"

- pressKey: back
- extendedWaitUntil:
    visible: "Search words..."
    timeout: 5000

# ── Teardown: Delete the created tag ─────────────────────────────────────────

- runFlow: ../utils/navigate_to_settings.yaml

- scrollUntilVisible:
    element: "Tag Manager"
    direction: DOWN
    timeout: 5000

- tapOn: "Tag Manager"

- extendedWaitUntil:
    visible: "${output.tag}"
    timeout: 8000

- tapOn: "Delete Tag"

- extendedWaitUntil:
    visible: "Delete this tag? Words with this tag will not be deleted."
    timeout: 5000

- tapOn: "Delete Tag"
- waitForAnimationToEnd

- assertNotVisible: "${output.tag}"

# pressKey: back does NOT work — Tag Manager uses dismissOnBackPress=false.
- tapOn: "Close"

- extendedWaitUntil:
    visible: "Theme"
    timeout: 5000
