appId: com.alirezaiyan.vokab
tags:
  - word-manager
  - tags
---
# Test: a tag can be assigned to a word from the word detail sheet, even when
# the user has no tags yet.
#
# Regression: the "Assign Tag" page used to be a dead end without tags — it only
# showed "No tags yet" and a disabled save button. It now offers "New Tag"; a tag
# created there is selected for the word straight away.
#
# Setup:    add a unique test word.
# Test:     word detail → Assign Tag → New Tag → create → Assign Tag → the tag
#           shows on the detail sheet.
# Teardown: delete the created tag via Settings → Tag Manager.

# Tags are listed by name: the '0test' + countdown prefix puts the newest test tag
# first, above any left over from aborted runs.
- evalScript: ${output.tag = '0test' + (9999999999 - Math.floor(Date.now() / 1000)) + 'assign'}

# ── Setup: Add a test word ────────────────────────────────────────────────────

- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/add_test_word.yaml

- runFlow: ../utils/navigate_to_word_manager.yaml
- extendedWaitUntil:
    visible: "Search words..."
    timeout: 15000

# ── Test: Create and assign a tag from the detail sheet ──────────────────────

- tapOn: "${output.word}"
- assertVisible: "Learning Progress"

- tapOn: "Assign Tag"

# The word is shown as context below the title.
- extendedWaitUntil:
    visible: "${output.word}"
    timeout: 8000

# The assignment page offers to create a tag, whatever tags already exist. It
# sits below the tag list, so with many tags it is off screen.
- scrollUntilVisible:
    element: "New Tag"
    direction: DOWN
    timeout: 15000

- tapOn: "New Tag"
- extendedWaitUntil:
    visible: "Tag name"
    timeout: 5000

- runFlow:
    file: ../utils/type_tag_name.yaml
    env:
      NAME: "${output.tag}"
- hideKeyboard

- tapOn: "Create Tag"
- waitForAnimationToEnd

# Back on the checklist with the new tag listed (and already ticked: saving
# without tapping it must assign it, asserted on the detail page below). It is
# first in the list, which may be scrolled down to "New Tag".
- scrollUntilVisible:
    element: "${output.tag}"
    direction: UP
    timeout: 15000

# Save. index 1: the page title (index 0) also reads "Assign Tag"; the save
# button is index 1. Tapping the title is a silent no-op.
- tapOn:
    text: "Assign Tag"
    index: 1
- waitForAnimationToEnd

# Back on the detail page, which now lists the assigned tag.
- extendedWaitUntil:
    visible: "Learning Progress"
    timeout: 8000
- assertVisible: "${output.tag}"

- pressKey: back
- extendedWaitUntil:
    visible: "Search words..."
    timeout: 5000

# ── Teardown: Delete the created tag ─────────────────────────────────────────

- runFlow: ../utils/navigate_to_settings.yaml

- scrollUntilVisible:
    element: "Tag Manager"
    direction: DOWN
    timeout: 5000

- tapOn: "Tag Manager"

- extendedWaitUntil:
    visible: "${output.tag}"
    timeout: 8000

# The trash icon in this tag's row: other tags may exist, so scope the tap to
# the row that holds the tag name.
- tapOn:
    text: "Delete Tag"
    childOf:
      containsChild: "${output.tag}"

- extendedWaitUntil:
    visible: "Delete this tag? Words with this tag will not be deleted."
    timeout: 5000
# Until the sheet settles, the list's trash icons are still in the hierarchy and
# index 1 could resolve to one of them.
- waitForAnimationToEnd

# The dialog title and its confirm button share the text; index 1 is the button.
- tapOn:
    text: "Delete Tag"
    index: 1
- waitForAnimationToEnd

- assertNotVisible: "${output.tag}"

# pressKey: back does NOT work — Tag Manager uses dismissOnBackPress=false.
- tapOn: "Close"

- extendedWaitUntil:
    visible: "Theme"
    timeout: 5000
