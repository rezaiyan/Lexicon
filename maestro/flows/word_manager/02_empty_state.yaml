appId: com.alirezaiyan.vokab
tags:
  - word-manager
  - empty-state
---
# LOCAL ONLY — requires a zero-word account. NOT included in CI config.
#
# Test: Word Manager empty state is rendered correctly when the library has no words.
#
# This flow requires a dedicated test account with no imported words and no
# server-synced data. The standard CI test account always has data (server sync
# ensures words are present), so this flow must be run manually on a fresh account:
#
#   maestro test maestro/flows/word_manager/02_empty_state.yaml
#
# If words exist, the empty state will not be shown and the assertions will fail.

- launchApp:
    clearState: false

- runFlow: ../utils/navigate_to_word_manager.yaml

# The empty library illustration headline must be visible.
- assertVisible: "Your word library is empty"

# The call-to-action subtitle must be visible.
- assertVisible: "Start by importing some words to build your vocabulary"

# The search bar should NOT be visible in the empty state
# (the Crossfade renders EmptyLibraryView, not WordListContent).
- assertNotVisible: "Search words..."

# The selection bar count must NOT be visible in the empty state.
- assertNotVisible: "0 items"
