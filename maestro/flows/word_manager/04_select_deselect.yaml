appId: com.alirezaiyan.vokab
tags:
  - word-manager
  - selection
---
# Test: Multi-select — entering selection mode, Select All, and deselect toggle.
#
# Creates a test word first to ensure at least one word exists in the library.

- launchApp:
    clearState: false

# Navigate to Study screen and add a test word so the library is non-empty.
- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/add_test_word.yaml

# Now navigate to the Word Manager.
- runFlow: ../utils/navigate_to_word_manager.yaml

# Verify we are in the word list (not empty state).
- assertVisible: "Search words..."

# Initially no words are selected; the selection bar is not visible.
- assertNotVisible:
    text: ".*selected.*"

# Long press the test word card to enter selection mode.
- longPressOn:
    text: "${output.word}"

# The bottom selection bar should appear showing the selected count (e.g. "1 selected").
- assertVisible:
    text: ".*selected.*"

# The "Select All" icon button must be present (content description "Select All").
- assertVisible: "Select All"

# Tap "Select All" to select every word in the list.
- tapOn: "Select All"

# All words should now be selected; the count text still contains "selected".
- assertVisible:
    text: ".*selected.*"

# Tap "Select All" again — it toggles to deselect all since every word is selected.
- tapOn: "Select All"

# After deselecting all, selection mode exits and the bar disappears.
- assertNotVisible:
    text: ".*selected.*"

# Word list is still visible after exiting selection mode.
- assertVisible: "Search words..."
