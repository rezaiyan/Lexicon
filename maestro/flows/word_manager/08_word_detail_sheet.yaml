appId: com.alirezaiyan.vokab
tags:
  - word-manager
  - detail
---
# Test: Word detail bottom sheet shows word info, learning progress, and details.
#
# Verifies that tapping a word in the Word Manager opens a detail sheet
# with the word, translation, learning progress, language details, and action buttons.
#
# Creates a test word first to ensure at least one word exists in the library.

- launchApp:
    clearState: false

# Navigate to Study screen and add a test word so the library is non-empty.
- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/add_test_word.yaml

# Now navigate to the Word Manager.
- runFlow: ../utils/navigate_to_word_manager.yaml

# Verify the word list is showing.
- assertVisible: "Search words..."

# Tap the test word to open the detail sheet.
- tapOn: "${output.word}"

# The detail sheet must show the word.
- assertVisible: "${output.word}"

# Learning Progress section must be visible.
- assertVisible: "Learning Progress"

# Detail rows must be visible.
- assertVisible: "Languages"
- assertVisible: "Added"
- assertVisible: "Reviews"

# The Edit icon (content description) must be present.
- assertVisible: "Edit"

# The Delete button must be present.
- assertVisible: "Delete"

# Dismiss the detail sheet by pressing back.
- pressKey: back

# The word list should be visible again.
- assertVisible: "Search words..."
