appId: com.alirezaiyan.vokab
tags:
  - word-manager
  - edit
---
# Test: Tapping a word opens the detail bottom sheet, then the Edit button opens
# the Edit Word dialog with correct fields. Cancel dismisses the dialog.
#
# Creates a test word first to ensure at least one word exists in the library.

- launchApp:
    clearState: false

# Navigate to Study screen and add a test word so the library is non-empty.
- runFlow: ../utils/navigate_to_study.yaml
- runFlow: ../utils/add_test_word.yaml

# Now navigate to the Word Manager.
- runFlow: ../utils/navigate_to_word_manager.yaml

# Wait for the word list to load (generous timeout for slow emulators).
- extendedWaitUntil:
    visible: "Search words..."
    timeout: 15000

# Tap the test word card to open the detail bottom sheet.
- tapOn: "${output.word}"

# The detail sheet must appear with the Edit icon (content description "Edit").
- assertVisible: "Edit"

# Tap Edit to open the EditWord dialog.
- tapOn: "Edit"

# The Edit Word dialog must appear with its title.
- assertVisible: "Edit Word"

# The Original Word input field must be visible.
- assertVisible: "Original Word"

# The Translation input field must be visible.
- assertVisible: "Translation"

# The Description input field must be visible.
- assertVisible: "Description (Optional)"

# The Save action button must be present.
- assertVisible: "Save"

# The Cancel action button must be present.
- assertVisible: "Cancel"

# Dismiss the dialog without saving.
- tapOn: "Cancel"

# The dialog must be gone.
- assertNotVisible: "Edit Word"

# Close the detail bottom sheet by tapping outside (top area above the sheet).
- tapOn:
    point: "50%,10%"

# Wait for the sheet dismiss animation.
- waitForAnimationToEnd

# The word list is visible again.
- extendedWaitUntil:
    visible: "Search words..."
    timeout: 5000
