appId: com.alirezaiyan.vokab
tags:
  - showcase
  - demo
  - video
---
# Showcase: Full app demo for video recording.
#
# This flow walks through Lexicon's key features at a pace suitable for
# screen recording. It is NOT included in the CI test suite — run it
# manually with:
#
#   maestro record maestro/flows/showcase/app_demo.yaml
#
# Flow:
#   1. Study screen — overview, stats
#   2. Import a word manually — shows the import experience
#   3. Import tabs — From File & From Image (AI-powered)
#   4. Flashcard review — flip card, rate, completion
#   5. Settings — theme switching, notification settings
#   6. Word Manager — search, word detail sheet
#   7. Profile — weekly activity, leaderboard
#
# Assumes:
#   - User is authenticated (CI tokens injected or logged in).
#   - At least a few words already exist for a richer demo.

# ─────────────────────────────────────────────
# 1. LAUNCH — Study Screen
# ─────────────────────────────────────────────
- launchApp:
    clearState: false

- runFlow: ../utils/navigate_to_study.yaml

# Pause to let the viewer see the Study screen with stats.
- waitForAnimationToEnd
- scroll:
    direction: DOWN
    duration: 1500

- scroll:
    direction: UP
    duration: 1500

# ─────────────────────────────────────────────
# 2. IMPORT — Add a word manually
# ─────────────────────────────────────────────
- tapOn: "Import Words"

# Method selector (premium): show AI Assistant & Manually options.
- assertVisible:
    text: "Add Words"
    optional: true

# Brief pause to show the options.
- waitForAnimationToEnd

- tapOn:
    text: "Manually"
    optional: true

# The manual import sheet opens with "Type Text" tab.
- assertVisible: "Type Text"
- assertVisible: "Add a Word"

# Fill in a demo word.
- tapOn: "Original Word"
- inputText: "Wanderlust"
- hideKeyboard

- tapOn: "Translation"
- inputText: "A strong desire to travel"
- hideKeyboard

# Scroll down to reveal description and Add Word button.
- scrollUntilVisible:
    element: "Description (Optional)"
    direction: DOWN

- tapOn: "Description (Optional)"
- inputText: "German origin — the joy of exploring new places"
- hideKeyboard

# Submit the word.
- tapOn: "Add Word"

# Wait for success feedback.
- waitForAnimationToEnd
- assertVisible:
    text: "words added"
    optional: true
- assertVisible:
    text: "already exist"
    optional: true

# ─────────────────────────────────────────────
# 3. IMPORT TABS — Show all import methods
# ─────────────────────────────────────────────
# Switch to "From File" tab.
- tapOn: "From File"
- assertVisible: "Import from File"

# Switch to "From Image" tab — AI-powered extraction.
- tapOn: "From Image"
- assertVisible: "AI-Powered Extraction"

# Back to "Type Text" for a clean exit.
- tapOn: "Type Text"
- assertVisible: "Add a Word"

# Close the import sheet.
- tapOn: "Close"
- assertVisible: "Import Words"

# ─────────────────────────────────────────────
# 4. FLASHCARD REVIEW — The core learning experience
# ─────────────────────────────────────────────
# Start a review session.
- tapOn: "Start Review"

# The review sheet opens with a flashcard.
- assertVisible: "Tap card to reveal"

# Pause to show the card front.
- waitForAnimationToEnd

# Flip the card by tapping the card area.
- tapOn:
    point: "50%,40%"

# Let the flip animation play out.
- waitForAnimationToEnd

# Rating buttons appear.
- assertVisible: "Did you get it?"
- assertVisible: "Nope"
- assertVisible: "Got it!"

# Rate as remembered.
- tapOn: "Got it!"

# Wait for the next card or completion.
- waitForAnimationToEnd

# If there are more cards, flip and rate one more.
# Using optional so it doesn't fail if the session already completed.
- tapOn:
    text: "Tap card to reveal"
    optional: true

# If another card appeared, flip it.
- tapOn:
    point: "50%,40%"
    optional: true

- waitForAnimationToEnd

# Rate the second card if visible.
- tapOn:
    text: "Got it!"
    optional: true

- waitForAnimationToEnd

# Completion screen may appear with stats.
- assertVisible:
    text: "Remembered"
    optional: true
- assertVisible:
    text: "Perfect Score!"
    optional: true
- assertVisible:
    text: "Outstanding!"
    optional: true
- assertVisible:
    text: "Solid Session!"
    optional: true

# If completion screen is showing, tap Done.
- tapOn:
    text: "Done"
    optional: true

# If review is still going, close it.
- tapOn:
    text: "Close"
    optional: true

# Handle exit confirmation if it appears.
- tapOn:
    text: "Exit Review?"
    optional: true

# Ensure we're back on Study screen.
- assertVisible: "Import Words"

# ─────────────────────────────────────────────
# 5. SETTINGS — Theme & Notifications
# ─────────────────────────────────────────────
- runFlow: ../utils/navigate_to_settings.yaml

# Show all settings cards.
- assertVisible: "Theme"
- assertVisible: "Notifications"
- assertVisible: "Word Manager"
- assertVisible: "Subscription"

# Open theme selector.
- tapOn: "Theme"

# Show theme options.
- assertVisible:
    text: "Light"
    optional: true
- assertVisible:
    text: "Dark"
    optional: true
- assertVisible:
    text: "Automatic"
    optional: true

# Select Dark theme for visual impact.
- tapOn:
    text: "Dark"
    optional: true

# Pause to show the theme change.
- waitForAnimationToEnd

# Dismiss theme sheet.
- pressKey: back

# Open notifications settings.
- tapOn: "Notifications"

- assertVisible: "Notification Settings"
- assertVisible: "Customize your learning reminders"
- assertVisible: "Enable Notifications"

# Dismiss notification settings.
- tapOn: "Done"
- assertVisible: "Settings"

# ─────────────────────────────────────────────
# 6. WORD MANAGER — Browse, search, detail
# ─────────────────────────────────────────────
- tapOn: "Word Manager"
- assertVisible: "Word Manager"

# Show the word list.
- assertVisible: "Search words..."

# Scroll down to browse words.
- scroll:
    direction: DOWN
    duration: 1500

- scroll:
    direction: UP
    duration: 1500

# Search for the word we added.
- tapOn: "Search words..."
- inputText: "Wanderlust"

# Pause to show search results.
- waitForAnimationToEnd

# Clear search.
- tapOn: "Cancel"

# Tap a word to show the detail sheet.
- tapOn:
    text: "Wanderlust"
    optional: true
- tapOn:
    text: "MaestroTest"
    optional: true

# Show learning progress and details.
- assertVisible:
    text: "Learning Progress"
    optional: true
- assertVisible:
    text: "Languages"
    optional: true
- assertVisible:
    text: "Added"
    optional: true
- assertVisible:
    text: "Reviews"
    optional: true

# Dismiss the detail sheet.
- pressKey: back

# Go back to settings.
- pressKey: back

# ─────────────────────────────────────────────
# 7. PROFILE — Activity & Leaderboard
# ─────────────────────────────────────────────
- runFlow: ../utils/navigate_to_profile.yaml

# The profile screen shows user info.
- assertVisible: "Profile"

# Check for leaderboard.
- assertVisible: "Leaderboard"

# Scroll to see weekly activity and stats.
- scroll:
    direction: DOWN
    duration: 1500

# Scroll back up.
- scroll:
    direction: UP
    duration: 1500

# Show more options menu.
- tapOn: "More options"
- assertVisible: "Edit Profile"
- assertVisible: "Delete Account"

# Dismiss the menu.
- pressKey: back
- assertVisible: "Profile"

# ─────────────────────────────────────────────
# 8. RESTORE — Switch back to auto theme
# ─────────────────────────────────────────────
- runFlow: ../utils/navigate_to_settings.yaml

- tapOn: "Theme"
- tapOn:
    text: "Automatic"
    optional: true
- pressKey: back

# Final view: back to Study screen.
- runFlow: ../utils/navigate_to_study.yaml
- assertVisible: "Import Words"
