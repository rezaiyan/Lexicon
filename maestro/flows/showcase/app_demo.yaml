appId: com.alirezaiyan.vokab
tags:
  - showcase
  - demo
  - video
---
# Showcase: Full app demo for promotional video.
#
# Pre-requisites:
#   - CI auth tokens injected (run maestro/run.sh or inject manually)
#   - Debug APK installed
#
# Run with screen recording:
#   adb shell screenrecord --size 1080x1920 --bit-rate 8M /sdcard/demo.mp4 &
#   maestro test maestro/flows/showcase/app_demo.yaml
#   adb shell pkill -INT screenrecord && adb pull /sdcard/demo.mp4
#
# Flow:
#   1.  Study screen — overview, stats, learning stages
#   2.  Import 10 words manually — vocabulary building
#   3.  Flashcard review — flip, rate, edit, completion
#   4.  Word Manager — browse, search, detail sheet
#   5.  Profile — user info, streak, activity
#   6.  Leaderboard — rankings
#   7.  Settings — theme, notifications, subscription
#   8.  AI Import — smart vocabulary generation (finale)

# ═════════════════════════════════════════════
# 1. STUDY SCREEN — Overview
# ═════════════════════════════════════════════
- stopApp
- launchApp:
    clearState: false

- waitForAnimationToEnd
- waitForAnimationToEnd

- runFlow: ../utils/navigate_to_study.yaml

# Let the viewer see the Study screen.
- waitForAnimationToEnd

# Scroll down to show learning stages.
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 1500

- waitForAnimationToEnd

# Scroll back up.
- swipe:
    start: "50%,30%"
    end: "50%,70%"
    duration: 1500

- waitForAnimationToEnd

# ═════════════════════════════════════════════
# 2. IMPORT 10 WORDS — Manual vocabulary building
# ═════════════════════════════════════════════
- tapOn: "Import Words"
- waitForAnimationToEnd

- tapOn:
    text: "Manually"
    optional: true

- waitForAnimationToEnd

# Set Original Language to German (default is English).
- tapOn:
    text: "Original Language"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Deutsch"
    optional: true
- waitForAnimationToEnd

# --- Word 1: Wanderlust (full experience with description) ---
- scrollUntilVisible:
    element: "Original Word"
    direction: DOWN
    timeout: 5000

- tapOn: "Original Word"
- eraseText: 50
- inputText: "Wanderlust"
- hideKeyboard

- tapOn: "Translation"
- eraseText: 50
- inputText: "A strong desire to travel"
- hideKeyboard

- scrollUntilVisible:
    element: "Description (Optional)"
    direction: DOWN

- tapOn: "Description (Optional)"
- eraseText: 50
- inputText: "German origin - the joy of exploring"
- hideKeyboard

- tapOn: "Add Word"
- waitForAnimationToEnd

# --- Word 2: Zeitgeist ---
- scrollUntilVisible:
    element: "Original Word"
    direction: DOWN
    timeout: 5000

- tapOn: "Original Word"
- eraseText: 50
- inputText: "Zeitgeist"
- hideKeyboard

- tapOn: "Translation"
- eraseText: 50
- inputText: "Spirit of the times"
- hideKeyboard

- tapOn: "Add Word"
- waitForAnimationToEnd

# --- Word 3: Schadenfreude ---
- tapOn: "Original Word"
- eraseText: 50
- inputText: "Schadenfreude"
- hideKeyboard

- tapOn: "Translation"
- eraseText: 50
- inputText: "Joy from others' misfortune"
- hideKeyboard

- tapOn: "Add Word"
- waitForAnimationToEnd

# --- Word 4: Rucksack ---
- tapOn: "Original Word"
- eraseText: 50
- inputText: "Rucksack"
- hideKeyboard

- tapOn: "Translation"
- eraseText: 50
- inputText: "Backpack for hiking"
- hideKeyboard

- tapOn: "Add Word"
- waitForAnimationToEnd

# --- Word 5: Fernweh ---
- tapOn: "Original Word"
- eraseText: 50
- inputText: "Fernweh"
- hideKeyboard

- tapOn: "Translation"
- eraseText: 50
- inputText: "Longing for distant places"
- hideKeyboard

- tapOn: "Add Word"
- waitForAnimationToEnd

# --- Word 6: Kindergarten ---
- tapOn: "Original Word"
- eraseText: 50
- inputText: "Kindergarten"
- hideKeyboard

- tapOn: "Translation"
- eraseText: 50
- inputText: "Children's garden"
- hideKeyboard

- tapOn: "Add Word"
- waitForAnimationToEnd

# --- Word 7: Poltergeist ---
- tapOn: "Original Word"
- eraseText: 50
- inputText: "Poltergeist"
- hideKeyboard

- tapOn: "Translation"
- eraseText: 50
- inputText: "A noisy ghost"
- hideKeyboard

- tapOn: "Add Word"
- waitForAnimationToEnd

# --- Word 8: Wunderkind ---
- tapOn: "Original Word"
- eraseText: 50
- inputText: "Wunderkind"
- hideKeyboard

- tapOn: "Translation"
- eraseText: 50
- inputText: "A child prodigy"
- hideKeyboard

- tapOn: "Add Word"
- waitForAnimationToEnd

# --- Word 9: Angst ---
- tapOn: "Original Word"
- eraseText: 50
- inputText: "Angst"
- hideKeyboard

- tapOn: "Translation"
- eraseText: 50
- inputText: "Deep anxiety or dread"
- hideKeyboard

- tapOn: "Add Word"
- waitForAnimationToEnd

# --- Word 10: Weltanschauung ---
- tapOn: "Original Word"
- eraseText: 50
- inputText: "Weltanschauung"
- hideKeyboard

- tapOn: "Translation"
- eraseText: 50
- inputText: "A comprehensive world view"
- hideKeyboard

- tapOn: "Add Word"
- waitForAnimationToEnd

# Close import sheet.
- pressKey: back

# Re-launch app in case we exited.
- launchApp:
    clearState: false

# Back on Study screen.
- runFlow: ../utils/navigate_to_study.yaml
- waitForAnimationToEnd

# ═════════════════════════════════════════════
# 3. FLASHCARD REVIEW — The core learning experience
# ═════════════════════════════════════════════
- tapOn: "Start Review"
- waitForAnimationToEnd

# --- Card 1: flip → Got it! ---
- tapOn:
    text: "Tap card to reveal"
    optional: true
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd
- tapOn:
    text: "Got it!"
    optional: true
- waitForAnimationToEnd

# --- Card 2: flip → show Edit → Got it! ---
- tapOn:
    text: "Tap card to reveal"
    optional: true
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd

# Show Edit feature briefly.
- tapOn:
    text: "Edit"
    retryTapIfNoChange: true
    optional: true
- waitForAnimationToEnd
- pressKey: back

- tapOn:
    text: "Got it!"
    optional: true
- waitForAnimationToEnd

# --- Card 3: flip → Nope (show both rating options) ---
- tapOn:
    text: "Tap card to reveal"
    optional: true
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd
- tapOn:
    text: "Nope"
    optional: true
- waitForAnimationToEnd

# --- Card 4: flip → Got it! ---
- tapOn:
    text: "Tap card to reveal"
    optional: true
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd
- tapOn:
    text: "Got it!"
    optional: true
- waitForAnimationToEnd

# --- Card 5: flip → Got it! ---
- tapOn:
    text: "Tap card to reveal"
    optional: true
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd
- tapOn:
    text: "Got it!"
    optional: true
- waitForAnimationToEnd

# --- Card 6: flip → Got it! ---
- tapOn:
    text: "Tap card to reveal"
    optional: true
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd
- tapOn:
    text: "Got it!"
    optional: true
- waitForAnimationToEnd

# --- Card 7: flip → Got it! ---
- tapOn:
    text: "Tap card to reveal"
    optional: true
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd
- tapOn:
    text: "Got it!"
    optional: true
- waitForAnimationToEnd

# --- Card 8: flip → Nope ---
- tapOn:
    text: "Tap card to reveal"
    optional: true
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd
- tapOn:
    text: "Nope"
    optional: true
- waitForAnimationToEnd

# --- Card 9: flip → Got it! ---
- tapOn:
    text: "Tap card to reveal"
    optional: true
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd
- tapOn:
    text: "Got it!"
    optional: true
- waitForAnimationToEnd

# --- Card 10: flip → Got it! ---
- tapOn:
    text: "Tap card to reveal"
    optional: true
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd
- tapOn:
    text: "Got it!"
    optional: true
- waitForAnimationToEnd

# Exit review — CI test user may have more cards than 10,
# so we exit mid-review rather than waiting for completion.
- waitForAnimationToEnd

# Tap X close button (top-left corner).
- tapOn:
    point: "7%,6%"
- waitForAnimationToEnd

# "Exit Review?" dialog — tap the red button (bottom of dialog).
- tapOn:
    point: "50%,78%"
    optional: true
- waitForAnimationToEnd

# Ensure we're on Study screen.
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- runFlow: ../utils/navigate_to_study.yaml
- waitForAnimationToEnd

# ═════════════════════════════════════════════
# 4. WORD MANAGER — Browse, search, detail
# ═════════════════════════════════════════════
- runFlow: ../utils/navigate_to_settings.yaml

- tapOn: "Word Manager"
- waitForAnimationToEnd

# Browse the word list.
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 1500

- swipe:
    start: "50%,30%"
    end: "50%,70%"
    duration: 1500

# Search for a word.
- tapOn:
    text: "Search words..."
    optional: true
- inputText: "Wanderlust"
- waitForAnimationToEnd
- tapOn:
    text: "Cancel"
    optional: true

# Tap a word to show detail sheet.
- tapOn:
    text: "Wanderlust"
    optional: true

# Show learning progress and details.
- assertVisible:
    text: "Learning Progress"
    optional: true
- waitForAnimationToEnd

# Scroll in detail sheet.
- swipe:
    start: "50%,70%"
    end: "50%,50%"
    duration: 800

- waitForAnimationToEnd

# Dismiss detail sheet.
- pressKey: back
- waitForAnimationToEnd

# Exit Word Manager reliably.
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd

# ═════════════════════════════════════════════
# 5. PROFILE — User info, streak, activity
# ═════════════════════════════════════════════
- runFlow: ../utils/navigate_to_profile.yaml

- assertVisible: "Profile"
- waitForAnimationToEnd

# Scroll to see weekly activity and member since.
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 1500

- waitForAnimationToEnd

# Scroll back up.
- swipe:
    start: "50%,30%"
    end: "50%,70%"
    duration: 1500

# ═════════════════════════════════════════════
# 6. LEADERBOARD — Rankings and competition
# ═════════════════════════════════════════════
- tapOn:
    text: "Leaderboard"
    optional: true

- waitForAnimationToEnd

# Scroll through leaderboard.
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 1500

- assertVisible:
    text: "Your Ranking"
    optional: true

- swipe:
    start: "50%,30%"
    end: "50%,70%"
    duration: 1500

- waitForAnimationToEnd

# Close leaderboard reliably.
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd

# ═════════════════════════════════════════════
# 7. SETTINGS — Theme, notifications, subscription
# ═════════════════════════════════════════════
- runFlow: ../utils/navigate_to_settings.yaml

# Show settings overview.
- waitForAnimationToEnd

# Theme — switch to Dark for visual impact.
- tapOn: "Theme"
- waitForAnimationToEnd
- tapOn:
    text: "Dark"
    optional: true
- waitForAnimationToEnd

# After Theme, reliably return to Settings.
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- runFlow: ../utils/navigate_to_settings.yaml

# Notifications.
- tapOn: "Notifications"
- waitForAnimationToEnd
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Maybe Later"
    optional: true

# Subscription.
- swipe:
    start: "50%,70%"
    end: "50%,50%"
    duration: 800

- tapOn:
    text: "Subscription"
    optional: true
- waitForAnimationToEnd

# Scroll to see premium features.
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 1500

- waitForAnimationToEnd

- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 1500

- waitForAnimationToEnd

# Go back from Subscription.
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- runFlow: ../utils/navigate_to_settings.yaml
- waitForAnimationToEnd

# Restore theme.
- tapOn: "Theme"
- waitForAnimationToEnd
- tapOn:
    text: "Automatic"
    optional: true
- waitForAnimationToEnd

# ═════════════════════════════════════════════
# 8. AI IMPORT — Smart vocabulary generation (finale)
# ═════════════════════════════════════════════
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- runFlow: ../utils/navigate_to_study.yaml

- tapOn: "Import Words"
- waitForAnimationToEnd

# Tap AI Assistant.
- tapOn:
    text: "AI Assistant"
    optional: true
- waitForAnimationToEnd

# Step 1: Target language — German.
- tapOn:
    text: "German"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Step 2: Native language — English.
- tapOn:
    text: "English"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Step 3: Proficiency level — Beginner.
- tapOn:
    text: "Beginner"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Step 4: Select topics.
- tapOn:
    text: "Travel"
    optional: true
- tapOn:
    text: "Daily Life"
    optional: true
- tapOn:
    text: "Food"
    optional: true
- waitForAnimationToEnd

# Scroll to show more topics.
- swipe:
    start: "50%,70%"
    end: "50%,50%"
    duration: 800

- waitForAnimationToEnd

# Generate words.
- tapOn:
    text: "Generate Words"
    optional: true

# Wait for AI generation (up to 20s).
- extendedWaitUntil:
    visible:
      text: "vocabulary"
    timeout: 20000
    optional: true

- waitForAnimationToEnd

# Scroll through generated words — the grand finale.
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 2000

- waitForAnimationToEnd

- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 2000

- waitForAnimationToEnd

# Scroll back up.
- swipe:
    start: "50%,30%"
    end: "50%,70%"
    duration: 2000

- waitForAnimationToEnd

# Import the AI-generated words.
- tapOn:
    text: "Import"
    optional: true
- tapOn:
    text: "Add to My Words"
    optional: true
- tapOn:
    text: "Accept"
    optional: true

- waitForAnimationToEnd

# Close if still open.
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Discard"
    optional: true

# Final view: Study screen with all words.
- runFlow: ../utils/navigate_to_study.yaml
- waitForAnimationToEnd

# Grand finale scroll.
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 2000

- swipe:
    start: "50%,30%"
    end: "50%,70%"
    duration: 2000
